<!doctype html><html lang="ja"><meta charset="utf-8"><title>縦交点1/2残差測定</title><style>body{font-family:sans-serif;margin:1rem}pre{white-space:pre-wrap;background:#eee;padding:1rem}</style><h1>1/2縮小 補正残差測定</h1><button id="run">実行</button><pre id="result">待機中</pre><script>
document.querySelector('#run').onclick=async()=>{const result=document.querySelector('#result');result.textContent='実行中';const [bytes,algorithm,runner,baseline]=await Promise.all([fetch('../paper-attendance-pyodide-poc/sample-input.jpg').then(r=>r.arrayBuffer()),fetch('../paper-attendance-preprocess-prototype.py').then(r=>r.text()),fetch('./quadrant_runner.py').then(r=>r.text()),fetch('../paper-attendance-final-evaluation-20261021/manifest.json').then(r=>r.json())]),worker=new Worker('./worker.js');worker.onmessage=e=>{if(!e.data.ok){result.textContent=e.data.error;return;}const m=e.data.manifest,b=new Map(baseline.cards.map(x=>[x.number,x])),changed=m.cards.filter(x=>{const y=b.get(x.number);return !y||x.status!==y.status||x.ink_score!==y.ink_score;}),truth=new Set([1,21,41,61,81,101,121,141,161,181,201,221,241,261,262,281,282,301,302,321,322,341,342,361,362,381,382]),detected=m.cards.filter(x=>truth.has(x.number)&&x.status!=='blank').map(x=>x.number);result.textContent=JSON.stringify({elapsed_ms:e.data.elapsedMs,wasm_heap_bytes:e.data.wasmHeapBytes,counts:m.screening.counts,truth_detected:`${detected.length}/27`,missed:[...truth].filter(x=>!detected.includes(x)),baseline_changed:changed.map(x=>x.number),quadrant_alignment:m.quadrant_alignment,stage_timings_ms:m.timings_ms},null,2);worker.terminate();};worker.postMessage({bytes,algorithm,runner,mode:'half-fast'},[bytes]);};
</script></html>
