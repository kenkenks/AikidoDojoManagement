<!doctype html><html lang="ja"><meta charset="utf-8"><title>縦交点1/2縮小PoC</title><style>body{font-family:sans-serif;margin:1rem}pre{white-space:pre-wrap;background:#eee;padding:1rem}img{max-width:45%;margin:.5rem;border:1px solid #888}</style><h1>縦交点 1/2縮小＋元画像局所確定</h1><button id="run">同一画像で実行</button><pre id="result">待機中</pre><div id="images"></div><script>
document.querySelector('#run').onclick=async()=>{const result=document.querySelector('#result'),images=document.querySelector('#images');result.textContent='実行中';const [bytes,algorithm,runner,baseline]=await Promise.all([fetch('../paper-attendance-pyodide-poc/sample-input.jpg').then(r=>r.arrayBuffer()),fetch('../paper-attendance-preprocess-prototype.py').then(r=>r.text()),fetch('./quadrant_runner.py').then(r=>r.text()),fetch('../paper-attendance-final-evaluation-20261021/manifest.json').then(r=>r.json())]),worker=new Worker('./worker.js');worker.onmessage=e=>{if(!e.data.ok){result.textContent=e.data.error;return;}const m=e.data.manifest,b=new Map(baseline.cards.map(x=>[x.number,x])),changed=m.cards.filter(x=>{const y=b.get(x.number);return !y||x.status!==y.status||x.ink_score!==y.ink_score;}),truth=new Set([1,21,41,61,81,101,121,141,161,181,201,221,241,261,262,281,282,301,302,321,322,341,342,361,362,381,382]),detected=m.cards.filter(x=>truth.has(x.number)&&x.status!=='blank').map(x=>x.number);result.textContent=JSON.stringify({elapsed_ms:e.data.elapsedMs,wasm_heap_bytes:e.data.wasmHeapBytes,cards:m.cards.length,counts:m.screening.counts,truth_detected:`${detected.length}/27`,missed:[...truth].filter(x=>!detected.includes(x)),baseline_changed:changed.map(x=>x.number),point_comparison:m.grid.point_comparison,stage_timings_ms:m.timings_ms},null,2);for(const x of e.data.selected){const f=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.src=URL.createObjectURL(new Blob([x.bytes],{type:'image/png'}));cap.textContent=`card ${x.number}`;f.append(img,cap);images.append(f);}worker.terminate();};worker.postMessage({bytes,algorithm,runner,mode:'half'},[bytes]);};
</script></html>
