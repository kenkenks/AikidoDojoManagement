<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>P3-6 iPhone独立検証</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#172033;background:#eef5fa}body{margin:0;padding:16px max(14px,env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.panel{background:#fff;border-radius:14px;padding:15px;margin:0 auto 14px;max-width:920px;box-shadow:0 2px 10px #16324a18}h1{font-size:1.35rem}h2{font-size:1.05rem}.note{background:#fff7d6;border-left:5px solid #cf8700;padding:10px}.file{display:block;border:2px dashed #6b8da5;padding:18px;border-radius:12px;text-align:center}input{max-width:100%}canvas{display:block;width:100%;height:auto;background:#222;border-radius:10px;touch-action:none}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:12px 16px;border:0;border-radius:10px;background:#146a8c;color:#fff;font-weight:700}button.secondary{background:#65727c}button:disabled{opacity:.45}progress{width:100%;height:18px}.status{font-weight:700;margin:.6rem 0}.elapsed{font-variant-numeric:tabular-nums}dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px}dt{font-weight:700}dd{margin:0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.78rem;background:#f3f5f7;padding:10px;border-radius:8px}.ok{color:#087337}.error{color:#b42318}.hidden{display:none}
</style></head><body>
<section class="panel"><h1>紙出席簿 P3-6 iPhone独立検証</h1><p class="note">既存画面・API・Firestoreには接続しません。画像は端末内のWorkerだけで処理します。</p><label class="file">iPhoneで撮影／画像を選択<br><input id="file" type="file" accept="image/*" capture="environment"></label></section>
<section class="panel"><h2>1. 紙全体の四隅</h2><p>赤い丸を左上・右上・右下・左下の順で紙外周へ合わせます。</p><canvas id="preview" width="900" height="600"></canvas><button id="reset" class="secondary" disabled>四隅を初期位置へ戻す</button></section>
<section class="panel"><h2>2. 独立処理</h2><div class="buttons"><button id="run" disabled>正面化・格子検出・400カード生成</button><button id="cancel" class="secondary" disabled>処理をキャンセル</button></div><progress id="progress" value="0" max="100"></progress><div id="status" class="status">画像を選択してください</div><div>経過時間：<span id="elapsed" class="elapsed">0:00</span></div></section>
<section id="resultPanel" class="panel hidden"><h2>3. 完了結果</h2><dl id="result"></dl><p>WASMヒープは確保容量であり、iPhone全体の使用量・空き容量・RSSではありません。</p><button id="download">結果JSONを保存</button><details><summary>段階別時間・メモリ</summary><pre id="metrics"></pre></details></section>
<section id="errorPanel" class="panel hidden"><h2 class="error">処理失敗</h2><p id="errorShort"></p><details open><summary>エラー詳細</summary><pre id="errorDetail"></pre></details></section>
<script src="./iphone_ui.js"></script></body></html>
