<!doctype html><meta charset="utf-8"><script>
const paperCorners=[[370/2880,1067/3840],[2520/2880,1105/3840],[2745/2880,2638/3840],[99/2880,2598/3840]],progress=[];(async()=>{try{const bytes=await fetch('/poc-input.jpg',{cache:'no-store'}).then(r=>r.arrayBuffer()),worker=new Worker('./iphone_worker.js');worker.onmessage=e=>{const data=typeof e.data==='string'?JSON.parse(e.data):e.data;if(data.type==='progress'){progress.push(data);return}if(data.type==='result'){for(const stage of Object.keys(data.report.timings_ms))progress.push({type:'measured-stage',stage});progress.push({type:'progress',stage:'complete',percent:100})}window.__pocResult={...data,progress};worker.terminate()};worker.postMessage({bytes,paperCorners},[bytes])}catch(error){window.__pocResult={type:'error',message:String(error)}})();
</script>
