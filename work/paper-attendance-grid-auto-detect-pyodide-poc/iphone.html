<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>P3-6 iPhone独立検証</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#172033;background:#eef5fa}body{margin:0;padding:16px max(14px,env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.panel{background:white;border-radius:14px;padding:15px;margin:0 auto 14px;max-width:920px;box-shadow:0 2px 10px #16324a18}h1{font-size:1.35rem;margin:.2rem 0 .6rem}h2{font-size:1.05rem}.note{background:#fff7d6;border-left:5px solid #cf8700;padding:10px}.file{display:block;border:2px dashed #6b8da5;padding:18px;border-radius:12px;text-align:center}input{max-width:100%}canvas{display:block;width:100%;height:auto;background:#222;border-radius:10px;touch-action:none}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:12px 16px;border:0;border-radius:10px;background:#146a8c;color:white;font-weight:700}button.secondary{background:#65727c}button:disabled{opacity:.45}progress{width:100%;height:18px}.status{font-weight:700;margin:.6rem 0}.elapsed{font-variant-numeric:tabular-nums}dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px}dt{font-weight:700}dd{margin:0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.78rem;background:#f3f5f7;padding:10px;border-radius:8px}.ok{color:#087337}.error{color:#b42318}.hidden{display:none}
</style></head><body>
<section class="panel"><h1>紙出席簿 P3-6 iPhone独立検証</h1><p class="note">既存画面・API・Firestoreには接続しません。画像はこの端末のWorker内だけで処理します。</p><label class="file">iPhoneで撮影／画像を選択<br><input id="file" type="file" accept="image/*" capture="environment"></label></section>
<section class="panel"><h2>1. 紙全体の四隅</h2><p>赤い丸を紙の外周四隅へ合わせます（左上・右上・右下・左下）。</p><canvas id="preview" width="900" height="600"></canvas><button id="reset" class="secondary" disabled>四隅を初期位置へ戻す</button></section>
<section class="panel"><h2>2. 独立処理</h2><div class="buttons"><button id="run" disabled>正面化・格子検出・400カード生成</button><button id="cancel" class="secondary" disabled>処理をキャンセル</button></div><progress id="progress" value="0" max="100"></progress><div id="status" class="status">画像を選択してください</div><div>経過時間：<span id="elapsed" class="elapsed">0:00</span></div></section>
<section id="resultPanel" class="panel hidden"><h2>3. 完了結果</h2><dl id="result"></dl><p>WASMヒープは確保容量であり、iPhone全体の使用量・空き容量・RSSではありません。</p><button id="download">結果JSONを保存</button><details><summary>段階別時間・メモリ</summary><pre id="metrics"></pre></details></section>
<section id="errorPanel" class="panel hidden"><h2 class="error">処理失敗</h2><p id="errorShort"></p><details open><summary>エラー詳細</summary><pre id="errorDetail"></pre></details></section>
<script>
const $=id=>document.getElementById(id),canvas=$('preview'),ctx=canvas.getContext('2d');let bitmap=null,blob=null,corners=[],drag=-1,worker=null,timer=null,started=0,wake=null,last=null;const defaults=()=>[{x:.08,y:.12},{x:.92,y:.12},{x:.92,y:.9},{x:.08,y:.9}],fmt=ms=>{const s=Math.floor(ms/1000);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(bitmap)ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);if(!corners.length)return;ctx.lineWidth=4;ctx.strokeStyle='#1479ff';ctx.beginPath();corners.forEach((p,i)=>i?ctx.lineTo(p.x*canvas.width,p.y*canvas.height):ctx.moveTo(p.x*canvas.width,p.y*canvas.height));ctx.closePath();ctx.stroke();corners.forEach((p,i)=>{const x=p.x*canvas.width,y=p.y*canvas.height;ctx.fillStyle='white';ctx.strokeStyle='#e22929';ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#172033';ctx.font='bold 13px sans-serif';ctx.fillText(String(i+1),x-4,y+5)})}
const encode=c=>new Promise((ok,ng)=>c.toBlob(b=>b?ok(b):ng(Error('JPEG_ENCODE_FAILED')),'image/jpeg',.94));
$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{$('status').textContent='画像の向きを正規化しています';try{bitmap=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(_){bitmap=await createImageBitmap(file)}const full=document.createElement('canvas');full.width=bitmap.width;full.height=bitmap.height;full.getContext('2d').drawImage(bitmap,0,0);blob=await encode(full);const scale=Math.min(1,900/bitmap.width);canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);corners=defaults();draw();full.width=full.height=1;$('run').disabled=$('reset').disabled=false;$('status').textContent=`準備完了：${bitmap.width}×${bitmap.height} / ${(blob.size/1048576).toFixed(2)} MiB`}catch(error){fail({stage:'image_normalization',message:'画像の準備に失敗しました',detail:String(error?.stack||error)})}};
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}canvas.onpointerdown=e=>{if(!corners.length)return;const p=pos(e);drag=corners.reduce((a,c,i)=>Math.hypot(c.x-p.x,c.y-p.y)<Math.hypot(corners[a].x-p.x,corners[a].y-p.y)?i:a,0);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag<0)return;const p=pos(e);corners[drag]={x:Math.max(0,Math.min(1,p.x)),y:Math.max(0,Math.min(1,p.y))};draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=-1;$('reset').onclick=()=>{corners=defaults();draw()};
function valid(){let area=0,sign=0;for(let i=0;i<4;i++){const a=corners[i],b=corners[(i+1)%4],c=corners[(i+2)%4];area+=a.x*b.y-b.x*a.y;const cross=(b.x-a.x)*(c.y-b.y)-(b.y-a.y)*(c.x-b.x);if(Math.abs(cross)<.002||sign&&Math.sign(cross)!==sign)return false;sign=Math.sign(cross)}return Math.abs(area)/2>.08}function stop(){clearInterval(timer);timer=null;wake?.release().catch(()=>{});wake=null}
function fail(d){stop();$('progress').value=0;$('status').textContent=`失敗（${d.stage||'不明'}）`;$('status').className='status error';$('errorShort').textContent=d.message||'画像処理に失敗しました';$('errorDetail').textContent=`段階: ${d.stage||'不明'}\nコード: ${d.code||'不明'}\n経過: ${fmt(d.elapsedMs||0)}\n\n${d.detail||''}`;$('errorPanel').classList.remove('hidden');$('resultPanel').classList.add('hidden');$('run').disabled=false;$('cancel').disabled=true}
$('run').onclick=async()=>{if(!blob||!valid()){alert('紙外周の四隅を交差しないよう指定してください。');return}try{if('wakeLock'in navigator)wake=await navigator.wakeLock.request('screen')}catch(_){}$('errorPanel').classList.add('hidden');$('resultPanel').classList.add('hidden');$('run').disabled=true;$('cancel').disabled=false;started=performance.now();timer=setInterval(()=>$('elapsed').textContent=fmt(performance.now()-started),500);const bytes=await blob.arrayBuffer();worker=new Worker('./iphone_worker.js');worker.onmessage=e=>{const d=e.data;if(d.type==='progress'){$('progress').value=d.percent;$('status').textContent=d.message;return}worker.terminate();worker=null;stop();$('cancel').disabled=true;if(d.type==='error'){fail(d);return}last={capturedAt:new Date().toISOString(),measurementNote:'wasmHeapBytes is allocated WebAssembly heap capacity, not iPhone process RSS or free memory',...d};$('progress').value=100;$('status').textContent='完了';$('status').className='status ok';$('elapsed').textContent=fmt(d.elapsedMs);const r=d.report,x=r.detection;$('result').innerHTML=`<dt>400カード</dt><dd>${r.cards===400?'成功':'失敗'}（${r.cards}枚）</dd><dt>格子</dt><dd>縦${x.x_lines.length}本／横${x.y_lines.length}本</dd><dt>外周</dt><dd>${x.corners_tl_tr_br_bl.map(p=>`(${p})`).join(' ')}</dd><dt>信頼度</dt><dd>${x.confidence.toFixed(3)}</dd><dt>判定</dt><dd>候補${r.screening_counts.candidate}／要確認${r.screening_counts.review}／空白${r.screening_counts.blank}</dd><dt>全体時間</dt><dd>${fmt(d.elapsedMs)}</dd><dt>WASMヒープ</dt><dd>${(d.wasmHeapBytes/1048576).toFixed(2)} MiB</dd>`;$('metrics').textContent=JSON.stringify({timings_ms:r.timings_ms,memory_samples:r.memory_samples},null,2);$('resultPanel').classList.remove('hidden');$('run').disabled=false};worker.onerror=e=>fail({stage:'worker',message:e.message,detail:`${e.filename}:${e.lineno}:${e.colno}`});worker.postMessage({bytes,paperCorners:corners.map(p=>[p.x,p.y])},[bytes])};
$('cancel').onclick=()=>{worker?.terminate();worker=null;stop();$('status').textContent='キャンセルしました';$('run').disabled=false;$('cancel').disabled=true;$('progress').value=0};$('download').onclick=()=>{if(!last)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));a.download=`p3-6-iphone-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;a.click()};
</script></body></html>
