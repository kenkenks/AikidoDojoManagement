<!doctype html><html lang="ja"><meta charset="utf-8"><title>統合前処理回帰</title>
<button id="run">実行</button><pre id="result">待機中</pre><script>
const truth=new Set([1,21,41,61,81,101,121,141,161,181,201,221,241,261,262,281,282,301,302,321,322,341,342,361,362,381,382]);
document.querySelector('#run').onclick=async()=>{const output=document.querySelector('#result');output.textContent='実行中';const bytes=await fetch('/work/paper-attendance-pyodide-poc/sample-input.jpg').then(response=>response.arrayBuffer()),worker=new Worker('/web/qr/paper_attendance_preprocess_worker.js');worker.onmessage=event=>{const data=event.data;if(data.type==='progress'){output.textContent=data.percent+'% '+data.message;return;}if(data.type==='error'){output.textContent='FAIL '+data.message;worker.terminate();return;}if(data.type==='result'){const cards=data.manifest.cards,detected=cards.filter(card=>truth.has(card.number)&&card.status!=='blank').map(card=>card.number);output.textContent=JSON.stringify({elapsed_ms:data.elapsedMs,wasm_heap_bytes:data.wasmHeapBytes,cards:cards.length,counts:data.manifest.screening.counts,truth_detected:detected.length+'/27',missed:[...truth].filter(number=>!detected.includes(number)),selected:[361,362,381,382].map(number=>{const card=cards.find(item=>item.number===number);return{number,status:card.status,ink_score:card.ink_score};}),timings_ms:data.manifest.timings_ms},null,2);worker.terminate();}};worker.postMessage({bytes},[bytes]);};
</script></html>
