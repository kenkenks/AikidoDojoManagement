name: Deploy QR pages

on:
  push:
    branches: [main]
    paths:
      - "web/qr/**"
      - "targets/**"
      - "tools/target.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Target Profile"
        required: true
        default: "demo-gas"
        type: choice
        options:
          - demo-gas
          - dev-gas

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build target artifact
        run: node tools/target.mjs build "${{ github.event.inputs.target || 'demo-gas' }}"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/${{ github.event.inputs.target || 'demo-gas' }}/web/qr
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
