name: Deploy QR pages

on:
  push:
    branches: [main]
    paths:
      - "web/qr/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin GitHub Pages to demo GAS
        shell: bash
        run: |
          cat > web/qr/runtime_config.js <<'EOF'
          (function() {
            window.DOJO_RUNTIME_CONFIG = Object.freeze({
              target: "demo-gas",
              runtime: "gas",
              apiBaseUrl: "https://script.google.com/macros/s/AKfycbwtpuZUDHMescE7Sz71SiIHn4l-SH_DJwQtKCQb251d7qGnmhvIN0f1txRHMMjHm88ebQ/exec"
            });
          })();
          EOF
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/qr
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
