<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPay決済コード登録</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body.member { background:#E3F2FD; }
    .amount { font-size:28px; font-weight:bold; margin:8px 0; }
    .ok { color:green; font-weight:bold; }
    .warn { color:#c47a00; font-weight:bold; }
    .error { color:#b00020; font-weight:bold; }
    .readonly { background:#f8f8f8; }
    .row { margin:8px 0; }
    ul { padding-left:20px; }
    li { margin-bottom:6px; }
    .code-input { letter-spacing:1px; }
  </style>
</head>
<body class="member">
  <h1>📲 PayPay決済コード登録</h1>
  <p class="note"><a href="member_home.html">← 会員ホームへ戻る</a></p>

  <section class="card">
    <h2>会員情報</h2>
    <label>会員ID</label>
    <input id="memberId" placeholder="例：M001">
    <label>プランID（会費情報から取得）</label>
    <input id="planId" class="readonly" placeholder="自動取得" readonly>
    <button class="primary member" onclick="startPayPayCode()">会費情報を表示</button>
    <div id="startResult" class="note"></div>
  </section>

  <section class="card" id="paymentInfoCard" style="display:none;">
    <h2>支払い情報</h2>
    <div class="row">会員名: <strong id="memberName">-</strong></div>
    <div class="row">対象月: <span id="targetMonth">-</span></div>
    <div class="row">会費タイプ: <span id="feeType">-</span></div>
    <div class="row">支払状態: <span id="status">-</span></div>
    <div class="row">請求明細: <span id="invoiceSummary">-</span></div>
    <div class="amount"><span id="amount">0</span>円</div>
    <div class="note">PayPayで上記金額を支払い、決済コードをコピーして下へ貼り付けてください。</div>
    <h3>対象エビデンス</h3>
    <ul id="evidenceList"></ul>
  </section>

  <section class="card" id="codeCard" style="display:none;">
    <h2>決済コード</h2>
    <label>PayPay決済コード</label>
    <input id="paypayCode" class="code-input" placeholder="PayPayの決済コードを貼り付け">
    <button id="recordPayPayButton" class="primary member" onclick="recordPayPayCode()">決済コードを登録</button>
    <div id="recordResult" class="note"></div>
  </section>

  <section class="card">
    <h2>操作ログ</h2>
    <ul id="log"></ul>
  </section>

  <p class="note"><a href="member_home.html">会員ホームへ戻る</a></p>

  <script src="virtual_session.js"></script>
  <script src="runtime_config.js"></script>
  <script src="firebase_auth.js"></script>
  <script src="dojo_api_client.js"></script>
  <script src="auth_gate.js"></script>
  <script src="page_initialization_manager.js"></script>
  <script src="system_context_adapter.js"></script>
  <script src="system_context.js"></script>
  <script>
    const RUNTIME_CONFIG = window.DOJO_RUNTIME_CONFIG;
    const GAS_URL = RUNTIME_CONFIG.apiBaseUrl;
    const IS_FIREBASE = RUNTIME_CONFIG.runtime === "firebase";
    const firebaseAuthClient = IS_FIREBASE ? window.DOJO_FIREBASE_AUTH.create({ runtimeConfig:RUNTIME_CONFIG }) : null;
    const dojoApiClient = IS_FIREBASE ? window.DOJO_API_CLIENT.create({ getCurrentUser:function() { return firebaseAuthClient.getCurrentUser(); } }) : null;
    const authGate = IS_FIREBASE ? window.DOJO_AUTH_GATE.create({ authClient:firebaseAuthClient, loginPath:"index.html" }) : null;
    const systemContextAdapter = IS_FIREBASE ? window.DOJO_SYSTEM_CONTEXT_ADAPTER.create() : null;

    let currentPayPay = null;
    let paypayRecordSending = false;
    let pendingStartRequestId = "";
    let pendingRecordRequestId = "";
    let initializationManager = null;
    let authUid = "";
    let redirectStarted = false;
    let operationsEnabled = !IS_FIREBASE;
    const payPayStateByUid = new Map();

    function switchPayPayOwner(previousUid, nextUid) {
      if (previousUid) {
        payPayStateByUid.set(previousUid, {
          currentPayPay:currentPayPay,
          pendingStartRequestId:pendingStartRequestId,
          pendingRecordRequestId:pendingRecordRequestId,
          memberId:document.getElementById("memberId").value,
          planId:document.getElementById("planId").value,
          paypayCode:document.getElementById("paypayCode").value
        });
      }
      const saved = payPayStateByUid.get(nextUid) || null;
      currentPayPay = saved ? saved.currentPayPay : null;
      pendingStartRequestId = saved ? saved.pendingStartRequestId : "";
      pendingRecordRequestId = saved ? saved.pendingRecordRequestId : "";
      paypayRecordSending = false;
      document.getElementById("memberId").value = saved ? saved.memberId : "";
      document.getElementById("planId").value = saved ? saved.planId : "";
      document.getElementById("paypayCode").value = saved ? saved.paypayCode : "";
      document.getElementById("paymentInfoCard").style.display = "none";
      document.getElementById("codeCard").style.display = "none";
      setMessage("startResult", "利用者が切り替わったため、前の利用者の決済状態を隔離しました。", "note");
      setMessage("recordResult", "", "note");
      if (currentPayPay) renderPaymentInfo(currentPayPay);
    }

    function createRequestId(prefix) {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return prefix + "_" + window.crypto.randomUUID();
      }
      return prefix + "_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    }

    async function firebasePayPayPost(action, input) {
      await firebaseAuthClient.ready;
      if (!firebaseAuthClient.getCurrentUser()) {
        throw new Error("DEV_AUTH_REQUIRED");
      }
      const response = await dojoApiClient.request(GAS_URL + "/api/webconnect", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:action,input:input})
      });
      const body = await response.json().catch(function() { return {}; });
      if (!response.ok) {
        const error = new Error(body.error || ("HTTP_" + response.status));
        error.status = response.status;
        handleAccessError(error);
        throw error;
      }
      return body;
    }

    function setDevTestCode(info) {
      if (!IS_FIREBASE || !RUNTIME_CONFIG.firebase || RUNTIME_CONFIG.firebase.projectId !== "dojo-management-dev") return;
      const amount = Number(info && info.amount);
      const memberId = String(info && info.memberId || "").trim();
      const date = String(info && info.receptionDate || getReceptionDate() || "").slice(0,10);
      const input = document.getElementById("paypayCode");
      if (!input.value.trim() && memberId && /^\d{4}-\d{2}-\d{2}$/.test(date) && Number.isFinite(amount) && amount > 0) {
        input.value = memberId + "-" + date.replace(/-/g, "") + "-" + amount;
      }
    }

    function getReceptionDate() {
      const systemContext = window.DOJO_SYSTEM_CONTEXT || null;
      if (systemContext && systemContext.system_now) {
        return String(systemContext.system_now).slice(0, 10);
      }

      const session = window.DojoVirtualSession ? DojoVirtualSession.get() : null;
      const context = session && session.context ? session.context : {};
      if (context.reception_date) {
        return String(context.reception_date).slice(0, 10);
      }

      // 業務日付にブラウザ端末時計は使わない。
      // 空なら GAS 側 paypay_code_start が sup_today(ctx) で確定する。
      return "";
    }

    function waitForSystemContext() {
      if (window.DOJO_SYSTEM_CONTEXT && window.DOJO_SYSTEM_CONTEXT.system_now) {
        return Promise.resolve(window.DOJO_SYSTEM_CONTEXT);
      }

      return new Promise(function(resolve) {
        let settled = false;

        function finish(value) {
          if (settled) return;
          settled = true;
          window.removeEventListener("dojo-system-context", onReady);
          window.removeEventListener("dojo-system-context-error", onError);
          resolve(value || null);
        }

        function onReady(event) {
          finish(event && event.detail ? event.detail : window.DOJO_SYSTEM_CONTEXT);
        }

        function onError(event) {
          addLog(
            "System Context取得失敗: " +
            ((event && event.detail && event.detail.message) || "不明なエラー")
          );
          finish(null);
        }

        window.addEventListener("dojo-system-context", onReady);
        window.addEventListener("dojo-system-context-error", onError);
      });
    }

    function setRecordControlState(info) {
      const button = document.getElementById("recordPayPayButton");
      const input = document.getElementById("paypayCode");
      if (!button || !input) return;

      const evidenceItems = info && Array.isArray(info.evidenceItems) ? info.evidenceItems : [];
      const hasRecordTarget = evidenceItems.some(function(evidence) {
        const status = String(evidence.status || "").toUpperCase();
        const evidenceCode = String(evidence.evidence_code || "").trim();
        return status === "REQUESTED" || (status === "CONFIRMED" && !evidenceCode);
      });
      const alreadyRegistered = evidenceItems.length > 0 && !hasRecordTarget;

      button.disabled = !operationsEnabled || paypayRecordSending || alreadyRegistered;
      input.disabled = !operationsEnabled || alreadyRegistered;

      if (paypayRecordSending) {
        button.textContent = "送信中...";
      } else if (alreadyRegistered) {
        button.textContent = "決済コード登録済み";
      } else {
        button.textContent = "決済コードを登録";
      }
    }

    window.addEventListener("load", function() { initializePayPayLifecycle(); });

    function setPayPayOperationsEnabled(enabled) {
      operationsEnabled = enabled === true;
      const startButton = document.querySelector('button[onclick="startPayPayCode()"]');
      if (startButton) startButton.disabled = !operationsEnabled;
      setRecordControlState(currentPayPay);
    }

    function initializePayPayLifecycle() {
      if (!IS_FIREBASE) { initializePayPayPage(); return; }
      setPayPayOperationsEnabled(false);
      initializationManager = window.DOJO_PAGE_INITIALIZATION_MANAGER.create({
        dependencies:[{ name:"auth", run:function(){ return authGate.requireAuthenticated(); } }],
        requiredTasks:[{ name:"page", run:function(context){ return initializePayPayPage(context); } }],
        optionalTasks:[{
          name:"systemContext", capability:"systemContext",
          run:function(){
            const current = systemContextAdapter.getCurrent();
            if (current) return current;
            const error = new Error("SYSTEM_CONTEXT_OPTIONAL_UNAVAILABLE");
            error.code = "SYSTEM_CONTEXT_OPTIONAL_UNAVAILABLE";
            throw error;
          }
        }],
        stopOperations:function(){ setPayPayOperationsEnabled(false); }
      });
      initializationManager.subscribe(function(state) {
        if (state.status === "READY") setPayPayOperationsEnabled(true);
      });
      authGate.subscribe(function(state) {
        if (state.status === "UNAUTHENTICATED") {
          authUid = ""; redirectStarted = false;
          initializationManager.accessLost("authentication_lost");
          redirectToLogin();
        } else if (state.status === "AUTHENTICATED") {
          const uid = String(state.user && state.user.uid || "");
          if (authUid && uid && uid !== authUid) {
            initializationManager.accessLost("authenticated_user_changed");
            switchPayPayOwner(authUid, uid);
            initializationManager.retry("authenticated_user_changed").catch(showInitializationError);
          }
          authUid = uid;
        } else if (state.status === "ERROR") {
          initializationManager.accessLost("authentication_error");
          showInitializationError(state.error);
        }
      });
      initializationManager.start().catch(function(error) {
        if (error && error.code !== "UNAUTHENTICATED") showInitializationError(error);
      });
    }

    function redirectToLogin() {
      if (!authGate || redirectStarted) return;
      redirectStarted = true;
      authGate.redirectToLogin(window.location.href);
    }

    function showInitializationError(error) {
      setMessage("startResult", "初期化に失敗しました: " + ((error && error.message) || String(error)), "error");
    }

    function isAccessError(error) {
      return error && (error.status === 401 || error.status === 403 || /HTTP[_\s]+(401|403)/.test(String(error.message || "")));
    }

    function handleAccessError(error) {
      if (IS_FIREBASE && initializationManager && isAccessError(error)) initializationManager.accessLost("authorization_lost");
    }

    function isOperationCurrent(generation) {
      return !IS_FIREBASE || (operationsEnabled && initializationManager && initializationManager.isCurrent(generation));
    }

    async function initializePayPayPage(managerContext) {
      const systemContext = IS_FIREBASE ? systemContextAdapter.getCurrent() : await waitForSystemContext();

      if (managerContext && !managerContext.isCurrent()) return null;

      if (systemContext && systemContext.system_now) {
        addLog("System Context確定: system_now=" + systemContext.system_now);
      } else {
        addLog("System Context未取得。受付日はVirtualSessionまたはGAS側で確定します。");
      }

      const params = new URLSearchParams(window.location.search);
      const queryMemberId = params.get("member_id") || "";
      const planId = params.get("plan_id") || "";

      if (queryMemberId && window.DojoVirtualSession) {
        DojoVirtualSession.loginMember(queryMemberId, "PAGE_URL");
      }

      const memberSession = window.DojoVirtualSession ? DojoVirtualSession.get() : null;
      const memberId =
        memberSession && memberSession.role === "MEMBER"
          ? (memberSession.member_id || "")
          : queryMemberId;

      document.getElementById("memberId").value = memberId;
      document.getElementById("planId").value = planId;

      if (memberId) {
        addLog("会員ID取得: member_id=" + memberId + (memberSession ? " (ログイン状態)" : " (URL)") +
          (planId ? " / plan_id=" + planId + " (互換用)" : ""));
        if (currentPayPay && String(currentPayPay.memberId || "") === memberId) {
          renderPaymentInfo(currentPayPay);
          return currentPayPay;
        }
        return startPayPayCode(managerContext);
      }
      return null;
    }

    async function startPayPayCode(managerContext) {
      if (IS_FIREBASE && !operationsEnabled && !managerContext) return;
      const generation = IS_FIREBASE ? (managerContext ? managerContext.generation : initializationManager.getState().generation) : 0;
      const memberId = document.getElementById("memberId").value.trim();
      const legacyPlanId = document.getElementById("planId").value.trim();

      if (!memberId) {
        setMessage("startResult", "member_id がありません。", "error");
        return;
      }

      const session = window.DojoVirtualSession ? DojoVirtualSession.get() : null;
      const context = session && session.context ? session.context : {};
      const locationId = context.location_id || "";
      const billingBlockId = context.billing_block_id || "";
      const teacherId = context.teacher_id || "";
      const receptionDate = getReceptionDate();

      addLog("PayPay受付開始: member_id=" + memberId +
        (legacyPlanId ? " / plan_id=" + legacyPlanId : " / plan_id=(GAS側で確定)"));
      addLog(
        "受付Context: reception_date=" + (receptionDate || "(GAS側確定)") +
        " / location_id=" + (locationId || "(空)") +
        " / billing_block_id=" + (billingBlockId || "(空)") +
        " / teacher_id=" + (teacherId || "PAYPAY_MEMBER")
      );
      setMessage("startResult", "会費情報を取得しています...", "note");

      // paypay_code_start 自身が会費情報取得・plan_id解決・REQUESTED作成まで行う。
      // 事前の getPaymentInfo は同じ請求情報を二重取得するため呼ばない。
      const input = {
        request_id: pendingStartRequestId || (pendingStartRequestId = createRequestId("PAYPAY_START")),
        member_id: memberId,
        plan_id: legacyPlanId || "",
        reception_date: receptionDate
      };
      const request = IS_FIREBASE ? firebasePayPayPost("paypay_code_start", input) : jsonp(GAS_URL, {
        action: "paypay_code_start",
        member_id: memberId,
        plan_id: legacyPlanId || "",
        reception_date: receptionDate,
        location_id: locationId,
        billing_block_id: billingBlockId,
        teacher_id: teacherId
      });
      return request.then(function(result) {
        if (IS_FIREBASE && !(managerContext ? managerContext.isCurrent() : isOperationCurrent(generation))) return null;
        addLog((IS_FIREBASE ? "Firebase" : "GAS") + "応答(paypay_code_start): " + JSON.stringify(result));

        if (!result || result.ok !== true) {
          setMessage("startResult", (result && result.message) || "PayPay情報を取得できませんでした。", "error");
          return;
        }

        document.getElementById("planId").value = result.planId || legacyPlanId || "";
        currentPayPay = result;
        renderPaymentInfo(result);
        setDevTestCode(result);
        pendingStartRequestId = "";
        setMessage("startResult", "会費情報を取得しました。", "ok");
      }).catch(function(error) {
        handleAccessError(error);
        if (IS_FIREBASE && !(managerContext ? managerContext.isCurrent() : isOperationCurrent(generation))) return null;
        addLog("PayPay開始失敗: " + (error.message || String(error)));
        const message = error.message === "DEV_AUTH_REQUIRED"
          ? "DEV端末の事前認証が必要です。管理者画面でログインしてから再度お試しください。"
          : "会費情報取得に失敗しました: " + (error.message || String(error));
        setMessage("startResult", message, "error");
      });
    }

    function renderPaymentInfo(info) {
      document.getElementById("paymentInfoCard").style.display = "block";
      document.getElementById("codeCard").style.display = Number(info.amount || 0) > 0 ? "block" : "none";

      document.getElementById("memberName").textContent = info.memberName || "-";
      document.getElementById("targetMonth").textContent = info.targetMonth || "-";
      document.getElementById("feeType").textContent = info.feeType || info.planId || "-";
      document.getElementById("status").textContent = info.status || "-";
      document.getElementById("invoiceSummary").textContent = info.invoiceSummary || "-";
      document.getElementById("amount").textContent = formatYen(Number(info.amount || 0));

      const evidenceList = document.getElementById("evidenceList");
      evidenceList.innerHTML = "";

      (info.evidenceItems || []).forEach(function(evidence) {
        const li = document.createElement("li");
        li.textContent = evidence.invoice_id + " / " + evidence.evidence_id + " / " + evidence.status;
        evidenceList.appendChild(li);
      });

      if (!info.evidenceItems || info.evidenceItems.length === 0) {
        const li = document.createElement("li");
        li.textContent = "対象エビデンスなし";
        evidenceList.appendChild(li);
      }

      setRecordControlState(info);
    }

    function recordPayPayCode() {
      if (IS_FIREBASE && !operationsEnabled) return;
      if (!currentPayPay) {
        setMessage("recordResult", "会費情報を先に表示してください。", "error");
        return;
      }

      if (paypayRecordSending) {
        return;
      }

      const evidenceItems = currentPayPay.evidenceItems || [];
      const recordItems = evidenceItems.filter(function(evidence) {
        const status = String(evidence.status || "").toUpperCase();
        const evidenceCode = String(evidence.evidence_code || "").trim();
        return status === "REQUESTED" || (status === "CONFIRMED" && !evidenceCode);
      });
      if (recordItems.length === 0) {
        setMessage("recordResult", "決済コードは登録済みです。", "ok");
        setRecordControlState(currentPayPay);
        return;
      }

      const code = document.getElementById("paypayCode").value.trim();
      if (!code) {
        setMessage("recordResult", "PayPay決済コードを入力してください。", "error");
        return;
      }

      const payload = {
        mode: "paypay_code_record",
        member_id: currentPayPay.memberId,
        plan_id: currentPayPay.planId,
        evidence_code: code,
        evidence_items: recordItems,
        location_id: currentPayPay.locationId || "",
        billing_block_id: currentPayPay.billingBlockId || "",
        teacher_id: currentPayPay.teacherId || "PAYPAY_MEMBER",
        source: "paypay_code.html"
      };

      if (IS_FIREBASE) {
        const input = {
          request_id: pendingRecordRequestId || (pendingRecordRequestId = createRequestId("PAYPAY_RECORD")),
          member_id: currentPayPay.memberId,
          evidence_code: code,
          evidence_items: recordItems.map(function(item) { return {evidence_id:item.evidence_id}; })
        };
        paypayRecordSending = true;
        setRecordControlState(currentPayPay);
        setMessage("recordResult", "決済コードを送信しています...", "note");
        const generation = initializationManager.getState().generation;
        firebasePayPayPost("paypay_code_record", input).then(function(result) {
          if (!isOperationCurrent(generation)) return;
          currentPayPay.evidenceItems = result.evidenceItems || currentPayPay.evidenceItems;
          pendingRecordRequestId = "";
          paypayRecordSending = false;
          renderPaymentInfo(currentPayPay);
          setMessage("recordResult", result.message || "決済コードを登録しました。", "ok");
          addLog("Firebase PayPayコード登録完了");
        }).catch(function(error) {
          handleAccessError(error);
          if (!isOperationCurrent(generation)) return;
          paypayRecordSending = false;
          setRecordControlState(currentPayPay);
          const unknown = !error.status || error.status >= 500;
          setMessage("recordResult", unknown
            ? "登録結果を確認できませんでした。同じ内容で再送できます。"
            : "決済コード登録に失敗しました: " + error.message, "error");
          addLog("Firebase PayPayコード登録エラー: " + error.message);
        });
        return;
      }

      paypayRecordSending = true;
      setRecordControlState(currentPayPay);
      addLog("PayPayコード登録送信予定: " + JSON.stringify(payload));
      setMessage("recordResult", "決済コードを送信しています...", "note");

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(payload)
      }).then(function() {
        recordItems.forEach(function(evidence) {
          evidence.status = "CONFIRMED";
          evidence.evidence_code = code;
        });
        paypayRecordSending = false;
        setRecordControlState(currentPayPay);
        setMessage("recordResult", "決済コード登録要求を送信しました。先生の決済更新後に入金反映されます。", "ok");
        addLog("PayPayコード登録要求完了");
      }).catch(function(error) {
        paypayRecordSending = false;
        setRecordControlState(currentPayPay);
        setMessage("recordResult", "決済コード登録送信に失敗しました。再送できます。", "error");
        addLog("PayPayコード登録送信エラー: " + error);
      });
    }

    function jsonp(url, params) {
      return new Promise(function(resolve, reject) {
        const callbackName = "paypayCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        const script = document.createElement("script");
        const query = new URLSearchParams(Object.assign({}, params, { callback: callbackName, _ts: Date.now() }));
        const fullUrl = url + "?" + query.toString();

        addLog("JSONP URL: " + fullUrl);

        let finished = false;
        const timeout = window.setTimeout(function() {
          cleanup();
          reject(new Error("GAS応答がタイムアウトしました。"));
        }, 15000);

        function cleanup() {
          if (finished) return;
          finished = true;
          window.clearTimeout(timeout);
          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(result) {
          addLog("JSONP callback受信: " + JSON.stringify(result));
          cleanup();
          resolve(result);
        };

        script.onerror = function() {
          addLog("JSONP script error。ただしtimeoutまで待機: " + fullUrl);
        };

        script.async = true;
        script.src = fullUrl;
        document.head.appendChild(script);
      });
    }

    function setMessage(id, message, className) {
      const el = document.getElementById(id);
      el.textContent = message;
      el.className = className || "note";
    }

    function addLog(message) {
      const li = document.createElement("li");
      const time = new Date().toLocaleTimeString();
      li.textContent = "[" + time + "] " + message;
      document.getElementById("log").prepend(li);
    }

    function formatYen(value) {
      return Number(value || 0).toLocaleString("ja-JP");
    }
  </script>
</body>
</html>
