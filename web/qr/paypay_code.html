<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPay決済コード登録</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body.member { background:#E3F2FD; }
    .amount { font-size:28px; font-weight:bold; margin:8px 0; }
    .ok { color:green; font-weight:bold; }
    .warn { color:#c47a00; font-weight:bold; }
    .error { color:#b00020; font-weight:bold; }
    .readonly { background:#f8f8f8; }
    .row { margin:8px 0; }
    ul { padding-left:20px; }
    li { margin-bottom:6px; }
    .code-input { letter-spacing:1px; }
  </style>
</head>
<body class="member">
  <h1>📲 PayPay決済コード登録</h1>

  <section class="card">
    <h2>会員情報</h2>
    <label>会員ID</label>
    <input id="memberId" placeholder="例：M001">
    <label>プランID（会費情報から取得）</label>
    <input id="planId" class="readonly" placeholder="自動取得" readonly>
    <button class="primary member" onclick="startPayPayCode()">会費情報を表示</button>
    <div id="startResult" class="note"></div>
  </section>

  <section class="card" id="paymentInfoCard" style="display:none;">
    <h2>支払い情報</h2>
    <div class="row">会員名: <strong id="memberName">-</strong></div>
    <div class="row">対象月: <span id="targetMonth">-</span></div>
    <div class="row">会費タイプ: <span id="feeType">-</span></div>
    <div class="row">支払状態: <span id="status">-</span></div>
    <div class="row">請求明細: <span id="invoiceSummary">-</span></div>
    <div class="amount"><span id="amount">0</span>円</div>
    <div class="note">PayPayで上記金額を支払い、決済コードをコピーして下へ貼り付けてください。</div>
    <h3>対象エビデンス</h3>
    <ul id="evidenceList"></ul>
  </section>

  <section class="card" id="codeCard" style="display:none;">
    <h2>決済コード</h2>
    <label>PayPay決済コード</label>
    <input id="paypayCode" class="code-input" placeholder="PayPayの決済コードを貼り付け">
    <button id="recordPayPayButton" class="primary member" onclick="recordPayPayCode()">決済コードを登録</button>
    <div id="recordResult" class="note"></div>
  </section>

  <section class="card">
    <h2>操作ログ</h2>
    <ul id="log"></ul>
  </section>

  <p class="note"><a href="member_home.html">会員ホームへ戻る</a></p>

  <script src="virtual_session.js"></script>
  <script src="system_context.js"></script>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz_Movz5VBZkf8qHdMkR7kkQRkLkYJAbahN5OPStFT8YXnhCuIGJBCdqjy2PwgWaorUfA/exec";

    let currentPayPay = null;
    let paypayRecordSending = false;

    function getReceptionDate() {
      const systemContext = window.DOJO_SYSTEM_CONTEXT || null;
      if (systemContext && systemContext.system_now) {
        return String(systemContext.system_now).slice(0, 10);
      }

      const session = window.DojoVirtualSession ? DojoVirtualSession.get() : null;
      const context = session && session.context ? session.context : {};
      if (context.reception_date) {
        return String(context.reception_date).slice(0, 10);
      }

      // 業務日付にブラウザ端末時計は使わない。
      // 空なら GAS 側 paypay_code_start が sup_today(ctx) で確定する。
      return "";
    }

    function waitForSystemContext() {
      if (window.DOJO_SYSTEM_CONTEXT && window.DOJO_SYSTEM_CONTEXT.system_now) {
        return Promise.resolve(window.DOJO_SYSTEM_CONTEXT);
      }

      return new Promise(function(resolve) {
        let settled = false;

        function finish(value) {
          if (settled) return;
          settled = true;
          window.removeEventListener("dojo-system-context", onReady);
          window.removeEventListener("dojo-system-context-error", onError);
          resolve(value || null);
        }

        function onReady(event) {
          finish(event && event.detail ? event.detail : window.DOJO_SYSTEM_CONTEXT);
        }

        function onError(event) {
          addLog(
            "System Context取得失敗: " +
            ((event && event.detail && event.detail.message) || "不明なエラー")
          );
          finish(null);
        }

        window.addEventListener("dojo-system-context", onReady);
        window.addEventListener("dojo-system-context-error", onError);
      });
    }

    function setRecordControlState(info) {
      const button = document.getElementById("recordPayPayButton");
      const input = document.getElementById("paypayCode");
      if (!button || !input) return;

      const evidenceItems = info && Array.isArray(info.evidenceItems) ? info.evidenceItems : [];
      const hasRecordTarget = evidenceItems.some(function(evidence) {
        const status = String(evidence.status || "").toUpperCase();
        const evidenceCode = String(evidence.evidence_code || "").trim();
        return status === "REQUESTED" || (status === "CONFIRMED" && !evidenceCode);
      });
      const alreadyRegistered = evidenceItems.length > 0 && !hasRecordTarget;

      button.disabled = paypayRecordSending || alreadyRegistered;
      input.disabled = alreadyRegistered;

      if (paypayRecordSending) {
        button.textContent = "送信中...";
      } else if (alreadyRegistered) {
        button.textContent = "決済コード登録済み";
      } else {
        button.textContent = "決済コードを登録";
      }
    }

    window.addEventListener("load", function() {
      initializePayPayPage();
    });

    async function initializePayPayPage() {
      const systemContext = await waitForSystemContext();

      if (systemContext && systemContext.system_now) {
        addLog("System Context確定: system_now=" + systemContext.system_now);
      } else {
        addLog("System Context未取得。受付日はVirtualSessionまたはGAS側で確定します。");
      }

      const params = new URLSearchParams(window.location.search);
      const queryMemberId = params.get("member_id") || "";
      const planId = params.get("plan_id") || "";

      if (queryMemberId && window.DojoVirtualSession) {
        DojoVirtualSession.loginMember(queryMemberId, "PAGE_URL");
      }

      const memberSession = window.DojoVirtualSession ? DojoVirtualSession.get() : null;
      const memberId =
        memberSession && memberSession.role === "MEMBER"
          ? (memberSession.member_id || "")
          : queryMemberId;

      document.getElementById("memberId").value = memberId;
      document.getElementById("planId").value = planId;

      if (memberId) {
        addLog("会員ID取得: member_id=" + memberId + (memberSession ? " (ログイン状態)" : " (URL)") +
          (planId ? " / plan_id=" + planId + " (互換用)" : ""));
        startPayPayCode();
      }
    }

    function startPayPayCode() {
      const memberId = document.getElementById("memberId").value.trim();
      const legacyPlanId = document.getElementById("planId").value.trim();

      if (!memberId) {
        setMessage("startResult", "member_id がありません。", "error");
        return;
      }

      const session = window.DojoVirtualSession ? DojoVirtualSession.get() : null;
      const context = session && session.context ? session.context : {};
      const locationId = context.location_id || "";
      const billingBlockId = context.billing_block_id || "";
      const teacherId = context.teacher_id || "";
      const receptionDate = getReceptionDate();

      addLog("PayPay受付開始: member_id=" + memberId +
        (legacyPlanId ? " / plan_id=" + legacyPlanId : " / plan_id=(GAS側で確定)"));
      addLog(
        "受付Context: reception_date=" + (receptionDate || "(GAS側確定)") +
        " / location_id=" + (locationId || "(空)") +
        " / billing_block_id=" + (billingBlockId || "(空)") +
        " / teacher_id=" + (teacherId || "PAYPAY_MEMBER")
      );
      setMessage("startResult", "会費情報を取得しています...", "note");

      // paypay_code_start 自身が会費情報取得・plan_id解決・REQUESTED作成まで行う。
      // 事前の getPaymentInfo は同じ請求情報を二重取得するため呼ばない。
      jsonp(GAS_URL, {
        action: "paypay_code_start",
        member_id: memberId,
        plan_id: legacyPlanId || "",
        reception_date: receptionDate,
        location_id: locationId,
        billing_block_id: billingBlockId,
        teacher_id: teacherId
      }).then(function(result) {
        addLog("GAS応答(paypay_code_start): " + JSON.stringify(result));

        if (!result || result.ok !== true) {
          setMessage("startResult", (result && result.message) || "PayPay情報を取得できませんでした。", "error");
          return;
        }

        document.getElementById("planId").value = result.planId || legacyPlanId || "";
        currentPayPay = result;
        renderPaymentInfo(result);
        setMessage("startResult", "会費情報を取得しました。", "ok");
      }).catch(function(error) {
        addLog("PayPay開始失敗: " + (error.message || String(error)));
        setMessage("startResult", "会費情報取得に失敗しました。", "error");
      });
    }

    function renderPaymentInfo(info) {
      document.getElementById("paymentInfoCard").style.display = "block";
      document.getElementById("codeCard").style.display = Number(info.amount || 0) > 0 ? "block" : "none";

      document.getElementById("memberName").textContent = info.memberName || "-";
      document.getElementById("targetMonth").textContent = info.targetMonth || "-";
      document.getElementById("feeType").textContent = info.feeType || info.planId || "-";
      document.getElementById("status").textContent = info.status || "-";
      document.getElementById("invoiceSummary").textContent = info.invoiceSummary || "-";
      document.getElementById("amount").textContent = formatYen(Number(info.amount || 0));

      const evidenceList = document.getElementById("evidenceList");
      evidenceList.innerHTML = "";

      (info.evidenceItems || []).forEach(function(evidence) {
        const li = document.createElement("li");
        li.textContent = evidence.invoice_id + " / " + evidence.evidence_id + " / " + evidence.status;
        evidenceList.appendChild(li);
      });

      if (!info.evidenceItems || info.evidenceItems.length === 0) {
        const li = document.createElement("li");
        li.textContent = "対象エビデンスなし";
        evidenceList.appendChild(li);
      }

      setRecordControlState(info);
    }

    function recordPayPayCode() {
      if (!currentPayPay) {
        setMessage("recordResult", "会費情報を先に表示してください。", "error");
        return;
      }

      if (paypayRecordSending) {
        return;
      }

      const evidenceItems = currentPayPay.evidenceItems || [];
      const recordItems = evidenceItems.filter(function(evidence) {
        const status = String(evidence.status || "").toUpperCase();
        const evidenceCode = String(evidence.evidence_code || "").trim();
        return status === "REQUESTED" || (status === "CONFIRMED" && !evidenceCode);
      });
      if (recordItems.length === 0) {
        setMessage("recordResult", "決済コードは登録済みです。", "ok");
        setRecordControlState(currentPayPay);
        return;
      }

      const code = document.getElementById("paypayCode").value.trim();
      if (!code) {
        setMessage("recordResult", "PayPay決済コードを入力してください。", "error");
        return;
      }

      const payload = {
        mode: "paypay_code_record",
        member_id: currentPayPay.memberId,
        plan_id: currentPayPay.planId,
        evidence_code: code,
        evidence_items: recordItems,
        location_id: currentPayPay.locationId || "",
        billing_block_id: currentPayPay.billingBlockId || "",
        teacher_id: currentPayPay.teacherId || "PAYPAY_MEMBER",
        source: "paypay_code.html"
      };

      paypayRecordSending = true;
      setRecordControlState(currentPayPay);
      addLog("PayPayコード登録送信予定: " + JSON.stringify(payload));
      setMessage("recordResult", "決済コードを送信しています...", "note");

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(payload)
      }).then(function() {
        recordItems.forEach(function(evidence) {
          evidence.status = "CONFIRMED";
          evidence.evidence_code = code;
        });
        paypayRecordSending = false;
        setRecordControlState(currentPayPay);
        setMessage("recordResult", "決済コード登録要求を送信しました。先生の決済更新後に入金反映されます。", "ok");
        addLog("PayPayコード登録要求完了");
      }).catch(function(error) {
        paypayRecordSending = false;
        setRecordControlState(currentPayPay);
        setMessage("recordResult", "決済コード登録送信に失敗しました。再送できます。", "error");
        addLog("PayPayコード登録送信エラー: " + error);
      });
    }

    function jsonp(url, params) {
      return new Promise(function(resolve, reject) {
        const callbackName = "paypayCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        const script = document.createElement("script");
        const query = new URLSearchParams(Object.assign({}, params, { callback: callbackName, _ts: Date.now() }));
        const fullUrl = url + "?" + query.toString();

        addLog("JSONP URL: " + fullUrl);

        let finished = false;
        const timeout = window.setTimeout(function() {
          cleanup();
          reject(new Error("GAS応答がタイムアウトしました。"));
        }, 15000);

        function cleanup() {
          if (finished) return;
          finished = true;
          window.clearTimeout(timeout);
          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(result) {
          addLog("JSONP callback受信: " + JSON.stringify(result));
          cleanup();
          resolve(result);
        };

        script.onerror = function() {
          addLog("JSONP script error。ただしtimeoutまで待機: " + fullUrl);
        };

        script.async = true;
        script.src = fullUrl;
        document.head.appendChild(script);
      });
    }

    function setMessage(id, message, className) {
      const el = document.getElementById(id);
      el.textContent = message;
      el.className = className || "note";
    }

    function addLog(message) {
      const li = document.createElement("li");
      const time = new Date().toLocaleTimeString();
      li.textContent = "[" + time + "] " + message;
      document.getElementById("log").prepend(li);
    }

    function formatYen(value) {
      return Number(value || 0).toLocaleString("ja-JP");
    }
  </script>
</body>
</html>
