<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>合気道システム 入口</title><link rel="stylesheet" href="common.css"><script src="https://unpkg.com/html5-qrcode"></script></head>
<body class="portal">
  <h1>🥋 合気道システム</h1>
  <section class="card">
    <h2>入口</h2>
    <div id="loginState" class="login-message">先生または会員のQRを読み取ってください。</div>
    <div id="normalEntryControls">
      <div class="grid entry-actions">
        <button id="scanButton" class="entry-primary" onclick="startLoginScan()">QR読み取り開始</button>
        <button id="stopButton" class="entry-secondary" onclick="stopLoginScan()">停止</button>
      </div>
      <div id="loginReader"></div>
      <p class="note">このログインは同じタブのページ間で保持されます。タブを閉じるか、ログアウトすると解除されます。</p>
    </div>
    <button id="firebaseLoginButton" type="button" hidden>Googleでログイン</button>
  </section>
  <section class="card" id="entryHelpCard">
    <h2>❓ 困ったとき</h2>
    <ul class="note">
      <li>ログインには先生または会員のQRコードが必要です。</li>
      <li>カメラの使用を確認されたら、許可してください。</li>
      <li>QRコードをカメラの中央に映してください。</li>
      <li>読み取れない場合は、道場の先生に確認してください。</li>
    </ul>
  </section>
  <section class="card" id="entryInformationCard">
    <h2>📢 ご案内</h2>
    <ul class="note">
      <li>システムのお知らせ：現在は案内事項なし</li>
      <li>道場公式WEBサイト：連携予定</li>
      <li>見学・体験のご案内：連携予定</li>
    </ul>
  </section>
  <script src="virtual_session.js"></script>
  <script src="runtime_config.js"></script>
  <script src="firebase_auth.js"></script>
  <script src="auth_gate.js"></script>
  <script>
    let loginQr = null;
    let loginScanning = false;
    let firebaseReturnGate = null;
    let returnNavigationStarted = false;

    const returnMode = new URLSearchParams(location.search).has("return_url");
    if (returnMode) {
      initializeFirebaseReturnMode();
    } else {
      applyLocationContextFromUrl();
      const urlIdentityApplied = applyIdentityFromUrl();
      renderLoginState();
      if (urlIdentityApplied) continueLogin();
    }


    function initializeFirebaseReturnMode() {
      document.getElementById("normalEntryControls").hidden = true;
      const loginButton = document.getElementById("firebaseLoginButton");
      const runtimeConfig = window.DOJO_RUNTIME_CONFIG;
      if (!runtimeConfig || runtimeConfig.runtime !== "firebase" ||
          !window.DOJO_FIREBASE_AUTH || !window.DOJO_AUTH_GATE) {
        showLoginMessage("Firebaseログインを利用できません。通常の入口へ戻ってください。", "error");
        return;
      }

      const requestedReturnUrl = new URLSearchParams(location.search).get("return_url") || "";
      const returnUrl = window.DOJO_AUTH_GATE.normalizeReturnUrl(requestedReturnUrl, {
        baseUrl:location.href,
        loginUrl:new URL("index.html", location.href).href
      });
      if (!returnUrl) {
        showLoginMessage("復帰先URLが不正です。通常の入口から操作してください。", "error");
        return;
      }
      const authClient = window.DOJO_FIREBASE_AUTH.create({ runtimeConfig:runtimeConfig });
      firebaseReturnGate = window.DOJO_AUTH_GATE.create({
        authClient:authClient,
        runtimeConfig:runtimeConfig,
        loginPath:"index.html"
      });
      firebaseReturnGate.rememberReturnUrl(returnUrl);

      loginButton.onclick = function() {
        loginButton.disabled = true;
        showLoginMessage("Googleログインを開始しています。", "");
        firebaseReturnGate.signInWithGoogle()
          .then(function() { return firebaseReturnGate.requireAuthenticated(); })
          .then(function() { returnToRequestedPage(returnUrl); })
          .catch(function(error) {
            loginButton.disabled = false;
            loginButton.hidden = false;
            showLoginMessage("Googleログインに失敗しました。もう一度お試しください。", "error");
          });
      };

      firebaseReturnGate.subscribe(function(state) {
        if (state.status === "CHECKING") {
          loginButton.hidden = true;
          showLoginMessage("Firebase認証状態を確認しています。", "");
        } else if (state.status === "UNAUTHENTICATED") {
          loginButton.hidden = false;
          loginButton.disabled = false;
          showLoginMessage("続けるにはGoogleログインが必要です。", "");
        } else if (state.status === "AUTHENTICATED") {
          loginButton.hidden = true;
          showLoginMessage("認証済みです。元の画面へ戻ります。", "ok");
          returnToRequestedPage(returnUrl);
        } else if (state.status === "ERROR") {
          loginButton.hidden = true;
          showLoginMessage("Firebase認証を初期化できませんでした。画面を再読み込みしてください。", "error");
        }
      });
      firebaseReturnGate.ready.catch(function() {});
    }

    function returnToRequestedPage(returnUrl) {
      if (!firebaseReturnGate || returnNavigationStarted) return;
      const validated = firebaseReturnGate.validateReturnUrl(returnUrl) ||
        firebaseReturnGate.getRememberedReturnUrl();
      if (!validated) {
        showLoginMessage("安全な復帰先を確認できませんでした。通常の入口から操作してください。", "error");
        return;
      }
      returnNavigationStarted = true;
      firebaseReturnGate.clearRememberedReturnUrl();
      location.assign(validated);
    }


    function applyLocationContextFromUrl() {
      const params = new URLSearchParams(location.search);
      const locationId = String(params.get("location_id") || "").trim();
      if (!locationId) return;
      DojoVirtualSession.setEntryContext({ location_id: locationId });
    }

    function applyIdentityFromUrl() {
      const params = new URLSearchParams(location.search);
      const teacherId = String(params.get("teacher_id") || "").trim();
      const memberId = String(params.get("member_id") || "").trim();
      if (teacherId) {
        DojoVirtualSession.loginTeacher(teacherId, "PAGE_URL");
        return true;
      }
      if (memberId) {
        DojoVirtualSession.loginMember(memberId, "PAGE_URL");
        return true;
      }
      return false;
    }

    function startLoginScan() {
      if (loginScanning) return;
      if (!window.Html5Qrcode) return showLoginMessage("QR読取機能を読み込めませんでした。", "error");
      loginQr = loginQr || new Html5Qrcode("loginReader");
      loginQr.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        handleLoginQr,
        function() {}
      ).then(function() { loginScanning = true; })
       .catch(function(error) { showLoginMessage("カメラを開始できませんでした: " + error, "error"); });
    }

    function stopLoginScan() {
      if (!loginQr || !loginScanning) return Promise.resolve();
      return loginQr.stop().then(function() { loginScanning = false; });
    }

    function handleLoginQr(text) {
      const identity = parseLoginQr(text);
      if (!identity.teacher_id && !identity.member_id) {
        showLoginMessage("先生・会員QRではありません。", "error");
        return;
      }
      stopLoginScan().catch(function() {}).then(function() {
        if (identity.teacher_id) {
          DojoVirtualSession.loginTeacher(identity.teacher_id, "ENTRY_QR");
          location.href = "teacher_home.html";
        } else {
          DojoVirtualSession.loginMember(identity.member_id, "ENTRY_QR");
          location.href = "member_home.html";
        }
      });
    }

    function parseLoginQr(text) {
      const result = { teacher_id: "", member_id: "" };
      try {
        const url = new URL(text, location.href);
        result.teacher_id = String(url.searchParams.get("teacher_id") || "").trim();
        result.member_id = String(url.searchParams.get("member_id") || "").trim();
      } catch (error) {}
      if (!result.teacher_id && !result.member_id) {
        const params = new URLSearchParams(String(text || "").replace(/^\?/, ""));
        result.teacher_id = String(params.get("teacher_id") || "").trim();
        result.member_id = String(params.get("member_id") || "").trim();
      }
      return result;
    }

    function renderLoginState() {
      const session = DojoVirtualSession.get();
      if (!session) return;
      const label = session.role === "TEACHER" ? "先生" : "会員";
      document.getElementById("loginState").innerHTML =
        '<div class="login-state"><strong>' + escapeHtml(label + " " + session.subject_id + " でログイン中") + '</strong>' +
        '<span><button onclick="continueLogin()">続ける</button> <button onclick="logoutHere()">ログアウト</button></span></div>';
      document.getElementById("loginState").className = "login-message ok";
    }

    function continueLogin() {
      const session = DojoVirtualSession.get();
      if (session) location.href = session.role === "TEACHER" ? "teacher_home.html" : "member_home.html";
    }

    function logoutHere() {
      DojoVirtualSession.logout();
      document.getElementById("loginState").textContent = "ログアウトしました。先生または会員のQRを読み取ってください。";
      document.getElementById("loginState").className = "login-message";
    }

    function showLoginMessage(message, type) {
      const target = document.getElementById("loginState");
      target.textContent = message;
      target.className = "login-message " + (type || "");
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, function(char) {
        return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[char];
      });
    }
  </script>
</body></html>
