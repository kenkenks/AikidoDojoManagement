<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合気道 会員ページ - 出席受付</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root { color-scheme: light; --green: #176b45; --amber: #9b6100; --red: #b3261e; }
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #FFF8E1; color: #222; }
    .role-badge { display:inline-block; padding:4px 8px; border-radius:999px; background:#d7efe0; color:#176b45; font-size:12px; font-weight:bold; margin-bottom:8px; }
    .top-nav { margin:0 0 12px; }
    .top-nav a { display:inline-block; margin:0 6px 6px 0; padding:7px 10px; border-radius:8px; border:1px solid #b7d8c4; background:#fff; color:#176b45; text-decoration:none; font-size:14px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    h2 { font-size: 17px; margin: 0 0 10px; }
    .card { background: #fff; padding: 14px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 10px; }
    .action-card { border-color: #b7d8c4; }
    .action-card h2 { margin-bottom: 6px; }
    .action-card > p { margin: 0 0 12px; color: #555; font-size: 14px; }
    .registration-status { margin: 12px 0; padding: 16px; border-radius: 10px; border: 2px solid #b7d8c4; background: #f4faf6; }
    .registration-status strong { display: block; font-size: 20px; margin-bottom: 5px; }
    .registration-status p { margin: 0; line-height: 1.5; }
    .registration-status.pending { border-color: #e4bb6b; background: #fff8e6; }
    .registration-status.success { border-color: #176b45; background: #dff3e6; }
    .registration-status.failure { border-color: #b3261e; background: #fff0ee; }
    #sendButton { width: 100%; margin: 4px 0 8px; padding: 14px; font-size: 18px; font-weight: bold; }
    .secondary-action { width: 100%; margin: 0; }
    .key-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .label { display: block; color: #666; font-size: 12px; margin-bottom: 3px; }
    .ok { color: var(--green); font-weight: bold; }
    .warn { color: var(--amber); font-weight: bold; }
    .error { color: var(--red); font-weight: bold; }
    #reader { width: 100%; max-width: 420px; margin: 0 auto 10px; }
    button { font-size: 15px; padding: 9px 12px; margin: 3px; border: 1px solid #aaa; border-radius: 8px; background: #fff; }
    button.primary { color: #fff; background: var(--green); border-color: var(--green); }
    button.slot.selected { color: #fff; background: #2a6fbb; border-color: #2a6fbb; }
    button.danger { color: var(--red); }
    button:disabled { opacity: .45; }
    select { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #aaa; border-radius: 8px; background: #fff; }
    [hidden] { display: none !important; }
    .candidate { border-top: 1px solid #e1e1e1; padding: 10px 0; }
    .candidate:first-child { border-top: 0; }
    .candidate-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .candidate-name { font-weight: bold; }
    .slots { margin-top: 7px; }
    .rank-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; margin-top: 8px; }
    .rank-row select { padding: 7px; font-size: 15px; }
    .progress { margin-top: 6px; padding: 7px 9px; border-radius: 7px; background: #f4f8fb; font-size: 14px; }
    .progress.near { background: #fff3cd; color: #6d4c00; font-weight: bold; }
    .progress.ready { background: #dff3e6; color: #176b45; font-weight: bold; }
    .empty { color: #777; }
    .action-guide { margin: 3px; padding: 10px 12px; border: 1px solid #d6b36a; border-radius: 8px; background: #fff8e6; color: var(--amber); font-weight: bold; }
    .latest { font-size: 13px; word-break: break-all; }
    #log { padding-left: 20px; margin-bottom: 0; }
    .firebase-access { background: #fff; }
    .firebase-access strong { display:block; margin-bottom: 4px; }
    .firebase-access p { margin: 0; line-height: 1.5; font-size: 14px; }
    .firebase-access .firebase-note { margin-top: 6px; color: #666; font-size: 12px; }
    .scan-actions { display: flex; flex-wrap: wrap; gap: 4px; }
    .scan-actions button { padding: 7px 11px; }
    .action-card { background: #fffdf6; }
    .diagnostic-card summary { cursor: pointer; font-weight: bold; padding: 4px 0; }
    .diagnostic-card .latest { padding-top: 7px; }
    .diagnostic-card #log { padding-top: 7px; }
  </style>
</head>
<body>
  <div class="role-badge">会員画面</div>
  <h1>合気道 出席受付</h1>
  <nav class="top-nav"><a href="member_home.html">会員ホーム</a><a href="paypay_code.html">PayPay決済コード登録</a><a href="index.html">入口</a></nav>

  <section id="firebaseAttendanceNotice" class="card firebase-access" hidden>
    <strong>Firebase DEV 接続</strong>
    <p id="firebaseAttendanceStatus">認証状態を確認しています。</p>
    <button id="firebaseAttendanceLogin" type="button" hidden>Googleログイン</button>
    <p class="firebase-note">接続状態は利用環境によって異なります。GASへの代替送信は行いません。</p>
  </section>

  <section class="card scope-strip" aria-label="出席受付設定">
    <div class="scope-field"><span class="label">道場</span><span id="locationId" class="warn">未設定</span></div>
    <div class="scope-field"><span class="label">先生</span><span id="teacherId" class="warn">未設定</span></div>
    <div class="scope-field"><span class="label">課金枠</span><span id="billingBlockId" class="warn">未設定</span></div>
    <div class="scope-field"><span class="label">稽古日</span><span id="attendanceDate"></span></div>
  </section>

  <section id="blockChoiceCard" class="card" hidden>
    <h2>課金枠を選択</h2>
    <div class="warn">現在時刻から一つに絞れませんでした。</div>
    <select id="blockChoice" onchange="selectBillingBlock(this.value)"></select>
  </section>

  <section class="card scan-card">
    <div id="reader"></div>
    <div class="scan-actions">
      <button id="scanStartButton" type="button" onclick="startScan()">読み取り開始</button>
      <button id="scanStopButton" type="button" onclick="stopScan()">停止</button>
    </div>
  </section>

  <section class="card action-card">
    <h2>出席する会員と稽古枠</h2>
    <p>会員と稽古枠を確認してから登録してください。</p>
    <label for="candidateSort">並び順</label>
    <select id="candidateSort" onchange="renderCandidates()">
      <option value="scan">読取順</option>
      <option value="rank">級・段順</option>
      <option value="exam">審査が近い順</option>
    </select>
    <div id="memberCandidates" class="empty">会員QRを読み取ってください。</div>
    <div id="teacherQrGuide" class="action-guide" hidden>先生QRを読み取ってください。</div>
    <div id="registrationStatus" class="registration-status" role="status" aria-live="polite" aria-atomic="true">
      <strong id="registrationStatusTitle">出席登録の準備</strong>
      <p id="registrationStatusDetail">先生QRと会員QRを読み取り、出席内容を確認してください。</p>
    </div>
    <button id="sendButton" class="primary" type="button" onclick="sendCandidatesToGas()">選択した出席を登録</button>
    <button id="clearCandidatesButton" class="secondary-action" type="button" onclick="clearCandidates()">会員一覧をクリア</button>
  </section>

  <details class="card diagnostic-card">
    <summary>最新読み取りURL</summary>
    <div id="latest" class="latest">なし</div>
  </details>

  <details class="card diagnostic-card">
    <summary>操作ログ</summary>
    <ul id="log"></ul>
  </details>

  <script src="virtual_session.js"></script>
  <script src="runtime_config.js"></script>
  <script src="firebase_auth.js"></script>
  <script src="auth_gate.js"></script>
  <script src="page_initialization_manager.js"></script>
  <script src="system_context_adapter.js"></script>
  <script src="dojo_api_client.js"></script>
  <script src="attendance_firebase_read.js"></script>
  <script>
    const SESSION_PRIMARY_ROLE = "MEMBER";
    const GAS_URL = window.DOJO_RUNTIME_CONFIG.apiBaseUrl;
    const IS_FIREBASE_ATTENDANCE = window.DOJO_RUNTIME_CONFIG.runtime === "firebase";
    const firebaseAttendanceAuth = IS_FIREBASE_ATTENDANCE
      ? window.DOJO_FIREBASE_AUTH.create({ runtimeConfig:window.DOJO_RUNTIME_CONFIG }) : null;
    const firebaseAttendanceApi = IS_FIREBASE_ATTENDANCE
      ? window.DOJO_API_CLIENT.create({ getCurrentUser:firebaseAttendanceAuth.getCurrentUser }) : null;
    const attendanceAuthGate = IS_FIREBASE_ATTENDANCE
      ? window.DOJO_AUTH_GATE.create({authClient:firebaseAttendanceAuth,
          runtimeConfig:window.DOJO_RUNTIME_CONFIG,loginPath:"index.html"}) : null;
    const attendanceSystemContext = IS_FIREBASE_ATTENDANCE
      ? window.DOJO_SYSTEM_CONTEXT_ADAPTER.create() : null;
    let attendanceInitializationManager = null;
    let attendanceAuthUid = "";
    let attendanceLoginRedirectStarted = false;
    let attendanceContextInitialized = false;
    let businessOperationsEnabled = !IS_FIREBASE_ATTENDANCE;
    const memberNameMap = { M001: "山田太郎", M002: "川本花子", M003: "佐藤一郎" };

    let html5QrCode = null;
    let scanning = false;
    let currentLocationId = "";
    let currentBillingBlockId = "";
    let currentTeacherId = "";
    let currentSlots = [];
    let memberCandidates = [];
    let lastText = "";
    let lastReadTime = 0;
    let attendanceSessionId = createSessionId();
    let submitting = false;
    let rankOptions = [];
    let entryMemberId = "";
    let attendanceInfoRequestSeq = 0;
    let attendanceInfoInFlightKey = "";
    let attendanceInfoLoadedKey = "";
    let attendanceClockKey = "";

    if (IS_FIREBASE_ATTENDANCE) initializeFirebaseAttendancePage();
    else {
      initializeAttendanceContext();
      document.getElementById("attendanceDate").textContent = currentAttendanceDate();
      updateSendButton();
      loadRankOptions();
    }


    function initializeFirebaseAttendancePage() {
      const notice = document.getElementById("firebaseAttendanceNotice");
      const status = document.getElementById("firebaseAttendanceStatus");
      const login = document.getElementById("firebaseAttendanceLogin");
      notice.hidden = false;
      login.hidden = true;
      login.onclick = function() { redirectAttendanceLogin(); };
      setBusinessOperationsEnabled(false);

      attendanceInitializationManager = window.DOJO_PAGE_INITIALIZATION_MANAGER.create({
        dependencies:[
          {name:"auth",run:function() { return attendanceAuthGate.requireAuthenticated(); }},
          attendanceSystemContext.dependency("systemContext")
        ],
        requiredTasks:[{name:"attendanceBusiness",capability:"attendance",
          run:initializeAttendanceBusiness}],
        optionalTasks:[{name:"rankOptions",capability:"rankOptions",
          run:function(context) { return loadRankOptions(context, true); }}],
        stopOperations:function(reason) { stopAttendanceOperations(reason); }
      });

      attendanceInitializationManager.subscribe(function(state) {
        if (state.status === "WAITING_DEPENDENCIES") status.textContent = "Firebase認証とシステム時刻を確認しています。";
        else if (state.status === "INITIALIZING") status.textContent = "出席受付を初期化しています。";
        else if (state.status === "READY") {
          status.textContent = state.capabilities.rankOptions === false
            ? "Firebase認証済み（級・段一覧は利用できません）" : "Firebase認証済み";
          setBusinessOperationsEnabled(true);
        } else if (state.status === "ERROR" && state.error && state.error.code !== "UNAUTHENTICATED") {
          status.textContent = "出席受付を初期化できませんでした: " + (state.error.message || String(state.error));
          showRegistrationStatus("failure", "出席受付を開始できません", "必須情報を取得できませんでした。画面を再読み込みしてください。");
        }
      });

      attendanceAuthGate.subscribe(function(state) {
        if (state.status === "CHECKING") {
          status.textContent = "Firebase認証状態を確認しています。";
        } else if (state.status === "UNAUTHENTICATED") {
          attendanceInitializationManager.accessLost("authentication_lost");
          attendanceAuthUid = "";
          status.textContent = "Firebase認証が必要です。ログイン画面へ移動します。";
          login.hidden = false;
          redirectAttendanceLogin();
        } else if (state.status === "AUTHENTICATED") {
          login.hidden = true;
          const uid = String(state.user && state.user.uid || "");
          if (attendanceAuthUid && uid && uid !== attendanceAuthUid) {
            attendanceInitializationManager.accessLost("authenticated_user_changed");
            clearCandidates(true);
            attendanceInitializationManager.retry("authenticated_user_changed").catch(handleAttendanceInitializationError);
          }
          attendanceAuthUid = uid;
        } else if (state.status === "ERROR") {
          attendanceInitializationManager.accessLost("authentication_error");
          status.textContent = "Firebase認証を初期化できませんでした。";
        }
      });

      attendanceSystemContext.subscribe(function(state) {
        if (state.status !== "READY") return;
        const managerState = attendanceInitializationManager.getState();
        if (managerState.status === "ERROR" && managerState.error &&
            managerState.error.code === "SYSTEM_CONTEXT_UNAVAILABLE") {
          attendanceInitializationManager.retry("system_context_recovered").catch(handleAttendanceInitializationError);
          return;
        }
        if (!state.changed || managerState.status !== "READY") return;
        handleAttendanceContextChange();
        attendanceInitializationManager.retry("system_context_changed").catch(handleAttendanceInitializationError);
      });

      attendanceInitializationManager.start().catch(handleAttendanceInitializationError);
    }

    function initializeAttendanceBusiness(context) {
      if (!context.isCurrent()) return false;
      if (!attendanceContextInitialized) {
        initializeAttendanceContext(true);
        attendanceContextInitialized = true;
      }
      document.getElementById("attendanceDate").textContent = currentAttendanceDate();
      attendanceClockKey = attendanceBusinessClockKey();
      return Promise.resolve(refreshAttendanceSessionInfoIfNeeded({managerContext:context,propagate:true})).then(function() {
        if (!context.isCurrent()) return false;
        return true;
      });
    }

    function handleAttendanceContextChange() {
      document.getElementById("attendanceDate").textContent = currentAttendanceDate();
      const clock = attendanceBusinessClockKey();
      if (attendanceClockKey && clock !== attendanceClockKey && !submitting) {
        ++attendanceInfoRequestSeq;
        attendanceInfoInFlightKey = attendanceInfoLoadedKey = "";
        currentBillingBlockId = "";
        currentSlots = [];
        clearCandidates(true);
        persistAttendanceContext();
        renderKeys();
      }
      attendanceClockKey = clock;
    }

    function handleAttendanceInitializationError(error) {
      if (!error || error.code === "UNAUTHENTICATED" || error.code === "INITIALIZATION_STALE" ||
          error.code === "SYSTEM_CONTEXT_WAIT_ABORTED") return;
      addLog("初期化エラー: " + (error.message || String(error)), "error");
    }

    function redirectAttendanceLogin() {
      if (!attendanceAuthGate || attendanceLoginRedirectStarted) return;
      attendanceLoginRedirectStarted = true;
      attendanceAuthGate.redirectToLogin(window.location.href);
    }

    function stopAttendanceOperations() {
      businessOperationsEnabled = false;
      ++attendanceInfoRequestSeq;
      attendanceInfoInFlightKey = "";
      setBusinessOperationsEnabled(false);
      if (scanning) stopScan();
    }

    function setBusinessOperationsEnabled(enabled) {
      businessOperationsEnabled = enabled === true;
      document.getElementById("scanStartButton").disabled = !businessOperationsEnabled;
      document.getElementById("scanStopButton").disabled = !businessOperationsEnabled;
      document.getElementById("candidateSort").disabled = !businessOperationsEnabled;
      document.getElementById("clearCandidatesButton").disabled = !businessOperationsEnabled;
      const blockChoice = document.getElementById("blockChoice");
      blockChoice.disabled = !businessOperationsEnabled || blockChoice.options.length <= 1;
      renderCandidates();
      updateSendButton();
    }


    function initializeAttendanceContext(deferSessionInfo) {
      const query = new URLSearchParams(window.location.search);
      const session = DojoVirtualSession.get();
      const context = session && session.context ? session.context : {};
      const urlTeacherId = String(query.get("teacher_id") || "").trim();
      const urlMemberId = String(query.get("member_id") || "").trim();
      entryMemberId = urlMemberId ||
        (SESSION_PRIMARY_ROLE === "MEMBER" && session && session.role === "MEMBER" ? session.member_id : "");

      currentLocationId = String(query.get("location_id") || context.location_id || "").trim();
      currentBillingBlockId = String(query.get("billing_block_id") || context.billing_block_id || "").trim();
      currentTeacherId = String(urlTeacherId ||
        (session && session.role === "TEACHER" ? session.teacher_id : "") ||
        context.teacher_id || "").trim();

      if (SESSION_PRIMARY_ROLE === "MEMBER" && urlMemberId) {
        DojoVirtualSession.loginMember(urlMemberId, "PAGE_URL");
      }

      persistAttendanceContext();
      renderKeys();

      if (currentLocationId) {
        addLog(query.get("location_id") ? "URLの道場情報を読み込みました。" : "Sessionの道場情報を復元しました。");
        if (!deferSessionInfo) refreshAttendanceSessionInfoIfNeeded();
      }
    }

    function persistAttendanceContext() {
      const session = DojoVirtualSession.get();
      if (!session) return null;
      return DojoVirtualSession.setContext({
        location_id: currentLocationId,
        teacher_id: currentTeacherId,
        billing_block_id: currentBillingBlockId
      });
    }

    function loadRankOptions(managerContext, propagate) {
      return jsonp(GAS_URL, { action: "attendance_rank_options" }).then(function(data) {
        if (managerContext && !managerContext.isCurrent()) return false;
        if (!data.ok) throw new Error(data.message || "級段位マスタを取得できませんでした。");
        rankOptions = Array.isArray(data.rank_options) ? data.rank_options : [];
        renderCandidates();
        return true;
      }).catch(function(error) {
        if (managerContext && !managerContext.isCurrent()) return false;
        addLog("級段位マスタ取得エラー: " + (error.message || String(error)), "error");
        if (propagate) throw error;
        return false;
      });
    }

    function startScan() {
      if (!businessOperationsEnabled || scanning) return;
      html5QrCode = html5QrCode || new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        function () {}
      ).then(function () {
        scanning = true;
        addLog("カメラを起動しました。");
      }).catch(function (error) {
        addLog("カメラ起動エラー: " + error, "error");
      });
    }

    function stopScan() {
      if (!html5QrCode || !scanning) return;
      html5QrCode.stop().then(function () {
        scanning = false;
        addLog("読み取りを停止しました。");
      }).catch(function (error) {
        addLog("停止エラー: " + error, "error");
      });
    }

    function onScanSuccess(decodedText) {
      if (!businessOperationsEnabled || submitting) return;
      const now = Date.now();
      if (decodedText === lastText && now - lastReadTime < 2000) return;
      lastText = decodedText;
      lastReadTime = now;
      document.getElementById("latest").textContent = decodedText;

      const parsed = parseQrText(decodedText);
      if (parsed.location_id || parsed.billing_block_id || parsed.teacher_id) {
        const hasLocation = !!parsed.location_id;
        const hasBillingBlock = !!parsed.billing_block_id;
        const hasTeacher = !!parsed.teacher_id;
        const previousCandidateScope = attendanceCandidateScopeKey();
        const locationChanged = hasLocation && parsed.location_id !== currentLocationId;
        const billingBlockChanged = hasBillingBlock && parsed.billing_block_id !== currentBillingBlockId;
        if (locationChanged) currentLocationId = parsed.location_id;
        if (locationChanged || billingBlockChanged) {
          currentBillingBlockId = hasBillingBlock ? parsed.billing_block_id : "";
          currentSlots = [];
        }
        if (hasTeacher) currentTeacherId = parsed.teacher_id;
        clearCandidatesWhenScopeChanged(previousCandidateScope);
        persistAttendanceContext();
        renderKeys();
        if (hasLocation && hasTeacher) {
          addLog("先生＋道場QR読取: " + currentTeacherId + " / " + currentLocationId);
        } else if (hasLocation || hasBillingBlock) {
          addLog(hasBillingBlock ? "道場・課金枠QRを読み取りました。" : "道場QRを読み取りました。課金枠を自動判定します。");
        } else {
          addLog("先生QR読取: " + currentTeacherId);
        }
        beep();
        if (locationChanged || billingBlockChanged ||
            ((hasLocation || hasBillingBlock) && currentSlots.length === 0))
          refreshAttendanceSessionInfoIfNeeded();
        return;
      }
      if (parsed.member_id) {
        if (currentSlots.length === 0) {
          addLog("先に道場QRを読み取り、課金枠を確定してください。", "error");
          beep(330);
          return;
        }
        addMemberCandidate(parsed.member_id);
        beep();
        return;
      }
      addLog("未分類QR: " + decodedText, "error");
      beep(330);
    }

    function parseQrText(text) {
      const result = { location_id: "", billing_block_id: "", teacher_id: "", member_id: "" };
      try {
        const url = new URL(text);
        Object.keys(result).forEach(function (key) { result[key] = url.searchParams.get(key) || ""; });
        return result;
      } catch (error) {
        String(text).split(/[&\n]/).forEach(function (part) {
          const separator = part.indexOf("=");
          if (separator < 1) return;
          const key = part.slice(0, separator).trim();
          const value = part.slice(separator + 1).trim();
          if (Object.prototype.hasOwnProperty.call(result, key)) result[key] = value;
        });
        return result;
      }
    }

    function attendanceSessionInfoKey() {
      return currentLocationId + "|" + currentBillingBlockId + "|" + attendanceBusinessClockKey();
    }

    function attendanceCandidateScopeKey() {
      return JSON.stringify([currentTeacherId,currentLocationId,currentBillingBlockId,currentAttendanceDate()]);
    }

    function clearCandidatesWhenScopeChanged(previousScope) {
      if (previousScope !== attendanceCandidateScopeKey()) clearCandidates(true);
    }

    function attendanceBusinessClockKey() {
      if (!IS_FIREBASE_ATTENDANCE) return "";
      const ctx = window.DOJO_SYSTEM_CONTEXT;
      return ctx ? JSON.stringify([ctx.time_travel_enabled,
        ctx.time_travel_enabled ? ctx.system_now : String(ctx.system_now || "").slice(0,10), ctx.target_month]) : "";
    }

    function refreshAttendanceSessionInfoIfNeeded(options) {
      if (!currentLocationId) return false;
      const key = attendanceSessionInfoKey();
      if (attendanceInfoInFlightKey === key || attendanceInfoLoadedKey === key) return false;
      return loadAttendanceSessionInfo(key, options);
    }

    function loadAttendanceSessionInfo(requestKey, options) {
      options = options || {};
      const managerContext = options.managerContext;
      if (!currentLocationId) {
        currentSlots = [];
        renderCandidates();
        addLog("location_id が必要です。", "error");
        return Promise.resolve(false);
      }

      const key = requestKey || attendanceSessionInfoKey();
      const requestSeq = ++attendanceInfoRequestSeq;
      attendanceInfoInFlightKey = key;
      const params = {
        action: "attendance_session_info",
        location_id: currentLocationId
      };
      if (currentBillingBlockId) params.billing_block_id = currentBillingBlockId;

      return jsonp(GAS_URL, params).then(function (data) {
        if (managerContext && !managerContext.isCurrent()) return false;
        if (requestSeq !== attendanceInfoRequestSeq) return;
        if (!data.ok) throw new Error(data.message || "稽古枠を取得できませんでした。");
        const previousCandidateScope = attendanceCandidateScopeKey();
        document.getElementById("locationId").textContent = data.location_name + " (" + data.location_id + ")";
        document.getElementById("locationId").className = "ok";

        if (data.requires_selection) {
          currentBillingBlockId = "";
          currentSlots = [];
          persistAttendanceContext();
          clearCandidatesWhenScopeChanged(previousCandidateScope);
          setKey("billingBlockId", "");
          updateSendButton();
          renderBlockChoices(data.billing_block_candidates || []);
          addLog(data.message || "課金枠を選択してください。", "warn");
          return true;
        }

        document.getElementById("blockChoiceCard").hidden = true;
        currentBillingBlockId = data.billing_block_id;
        currentSlots = data.slots || [];
        persistAttendanceContext();
        document.getElementById("billingBlockId").textContent = data.billing_block_name;
        document.getElementById("billingBlockId").className = "ok";
        clearCandidatesWhenScopeChanged(previousCandidateScope);
        addLog((data.inferred ? "現在時刻から自動判定: " : "課金枠を設定: ") + data.billing_block_name);
        attendanceInfoLoadedKey = attendanceSessionInfoKey();
        if (entryMemberId) {
          const memberId = entryMemberId;
          entryMemberId = "";
          addMemberCandidate(memberId, {initialization:true});
        }
        return true;
      }).catch(function (error) {
        if (managerContext && !managerContext.isCurrent()) return false;
        if (requestSeq !== attendanceInfoRequestSeq) return;
        currentSlots = [];
        renderCandidates();
        addLog(error.message || String(error), "error");
        if (options.propagate) throw error;
        return false;
      }).finally(function () {
        if ((!managerContext || managerContext.isCurrent()) && requestSeq === attendanceInfoRequestSeq)
          attendanceInfoInFlightKey = "";
      });
    }

    function renderBlockChoices(candidates) {
      const card = document.getElementById("blockChoiceCard");
      const select = document.getElementById("blockChoice");
      select.innerHTML = "";
      const emptyOption = document.createElement("option");
      emptyOption.value = "";
      emptyOption.textContent = candidates.length ? "課金枠を選んでください" : "選択できる課金枠がありません";
      select.appendChild(emptyOption);
      candidates.forEach(function (candidate) {
        const option = document.createElement("option");
        option.value = candidate.billing_block_id;
        option.textContent = candidate.label + "（" + candidate.start_time + "–" + candidate.end_time + "）";
        select.appendChild(option);
      });
      select.disabled = !businessOperationsEnabled || candidates.length === 0;
      card.hidden = false;
    }

    function selectBillingBlock(billingBlockId) {
      if (!businessOperationsEnabled || !billingBlockId) return;
      const previousCandidateScope = attendanceCandidateScopeKey();
      currentBillingBlockId = billingBlockId;
      currentSlots = [];
      clearCandidatesWhenScopeChanged(previousCandidateScope);
      persistAttendanceContext();
      renderKeys();
      refreshAttendanceSessionInfoIfNeeded();
    }

    function addMemberCandidate(memberId, options) {
      if (!businessOperationsEnabled && !(options && options.initialization)) return;
      if (submitting) {
        addLog("送信確認中のため、会員追加を待ってください。", "warn");
        return;
      }
      const existing = memberCandidates.find(function (candidate) { return candidate.member_id === memberId; });
      if (existing) {
        if (!existing.loaded && existing.load_error) {
          existing.load_error = "";
          renderCandidates();
          addLog("会員QR再読取: " + memberId + " の状態を再取得します。", "warn");
          loadMemberAttendanceState(memberId);
          return;
        }
        addLog("二重スキャンを無視しました: " + memberId);
        return;
      }
      memberCandidates.push({
        member_id: memberId,
        member_name: "",
        current_rank: "",
        next_rank: "",
        rank_changed: false,
        training_count: 0,
        required_training_count: 0,
        remaining_training_count: null,
        training_days: 0,
        required_training_days: 0,
        remaining_training_days: null,
        examination_ready: false,
        slot_ids: [],
        billing_plan_id: "",
        billing_plan_name: "",
        billing_plan_selected: false,
        billing_plan_candidates: [],
        loaded: false,
        load_error: ""
      });
      renderCandidates();
      addLog("会員QR読取: " + memberId + "（登録済み出席を確認中）");
      loadMemberAttendanceState(memberId);
    }

    function loadMemberAttendanceState(memberId, expectedState, quiet, savedOnly) {
      const initializationGeneration = IS_FIREBASE_ATTENDANCE && attendanceInitializationManager
        ? attendanceInitializationManager.getState().generation : null;
      if (initializationGeneration !== null &&
          !attendanceInitializationManager.isCurrent(initializationGeneration)) {
        return Promise.resolve({ok:false,matches:false,member_id:memberId,stale:true});
      }
      return jsonp(GAS_URL, {
        action: savedOnly ? "attendance_saved_state" : "member_attendance_state",
        attendance_date: currentAttendanceDate(),
        member_id: memberId,
        location_id: currentLocationId,
        billing_block_id: currentBillingBlockId
      }).then(function (data) {
        if (initializationGeneration !== null &&
            !attendanceInitializationManager.isCurrent(initializationGeneration))
          return {ok:false,matches:false,member_id:memberId,stale:true};
        if (!data.ok) throw new Error(data.message || "登録済み出席を取得できませんでした。");
        const candidate = memberCandidates.find(function (item) { return item.member_id === memberId; });
        if (!candidate) return { ok: false, matches: false, member_id: memberId };
        const actualSlotIds = normalizeSlotIds(data.selected_slot_ids || []);
        candidate.slot_ids = actualSlotIds;
        candidate.current_rank = data.current_rank || candidate.current_rank || "";
        if (!savedOnly) {
          candidate.member_name = data.member_name || "";
          candidate.next_rank = data.next_rank || "";
          candidate.rank_changed = false;
          candidate.training_count = Number(data.training_count || 0);
          candidate.required_training_count = Number(data.required_training_count || 0);
          candidate.remaining_training_count = data.remaining_training_count === null
            ? null
            : Number(data.remaining_training_count);
          candidate.training_days = Number(data.training_days || 0);
          candidate.required_training_days = Number(data.required_training_days || 0);
          candidate.remaining_training_days = data.remaining_training_days ?? null;
          candidate.examination_ready = data.examination_ready === true;
          candidate.billing_plan_id = data.billing_plan_id || candidate.billing_plan_id || "";
          candidate.billing_plan_name = data.billing_plan_name || candidate.billing_plan_name || "";
          candidate.billing_plan_selected = data.billing_plan_selected === true;
          candidate.billing_plan_candidates = Array.isArray(data.billing_plan_candidates)
            ? data.billing_plan_candidates
            : [];
          if (!candidate.billing_plan_id && candidate.billing_plan_candidates.length === 1) {
            candidate.billing_plan_id = candidate.billing_plan_candidates[0].plan_id;
          }
        }
        candidate.loaded = true;
        candidate.load_error = "";
        renderCandidates();
        const slotMatches = !expectedState ||
          slotIdsEqual(actualSlotIds, normalizeSlotIds(expectedState.slot_ids || []));
        const rankMatches = !expectedState || data.current_rank === expectedState.current_rank;
        if (!quiet) addLog(memberId + " の登録済み枠を復元しました（" + candidate.slot_ids.length + "枠）。");
        return { ok: true, matches: slotMatches && rankMatches, member_id: memberId };
      }).catch(function (error) {
        if (initializationGeneration !== null &&
            !attendanceInitializationManager.isCurrent(initializationGeneration))
          return {ok:false,matches:false,member_id:memberId,stale:true};
        const candidate = memberCandidates.find(function (item) { return item.member_id === memberId; });
        if (!candidate) return { ok: false, matches: false, member_id: memberId };
        candidate.loaded = false;
        candidate.load_error = error.message || String(error);
        renderCandidates();
        if (!quiet) addLog(memberId + " の状態取得に失敗: " + candidate.load_error, "error");
        return { ok: false, matches: false, member_id: memberId };
      });
    }

    function refreshAllMemberStates(expectedByMember, attempt) {
      attempt = Number(attempt || 1);
      memberCandidates.forEach(function(candidate) {
        candidate.loaded = false;
        candidate.load_error = "";
      });
      renderCandidates();

      return Promise.all(memberCandidates.map(function(candidate) {
        return loadMemberAttendanceState(
          candidate.member_id,
          expectedByMember[candidate.member_id],
          attempt > 1,
          !IS_FIREBASE_ATTENDANCE
        );
      })).then(function(results) {
        const failed = results.filter(function(result) { return !result.ok; });
        const mismatched = results.filter(function(result) { return result.ok && !result.matches; });
        if ((failed.length > 0 || mismatched.length > 0) && attempt < 6) {
          addLog((IS_FIREBASE_ATTENDANCE ? "保存結果" : "GASの保存完了") + "を待っています（確認 " + attempt + "/6）。", "warn");
          return new Promise(function(resolve) {
            window.setTimeout(function() {
              resolve(refreshAllMemberStates(expectedByMember, attempt + 1));
            }, 700);
          });
        }
        if (failed.length > 0 || mismatched.length > 0) {
          const ids = failed.concat(mismatched).map(function(result) { return result.member_id; });
          addLog("画面選択と保存結果を確認できません: " + Array.from(new Set(ids)).join(", "), "error");
          return false;
        }
        addLog("登録結果を再取得し、画面と出席ログの一致を確認しました。", "ok");
        return true;
      });
    }

    function toggleSlot(memberId, slotId) {
      const candidate = memberCandidates.find(function (item) { return item.member_id === memberId; });
      if (!businessOperationsEnabled || !candidate || !candidate.loaded || submitting) return;
      const index = candidate.slot_ids.indexOf(slotId);
      if (index >= 0) candidate.slot_ids.splice(index, 1);
      else candidate.slot_ids.push(slotId);
      renderCandidates();
    }

    function removeCandidate(memberId) {
      if (!businessOperationsEnabled || submitting) return;
      memberCandidates = memberCandidates.filter(function (item) { return item.member_id !== memberId; });
      renderCandidates();
    }

    function renderCandidates() {
      const container = document.getElementById("memberCandidates");
      container.innerHTML = "";
      container.className = memberCandidates.length ? "" : "empty";
      if (memberCandidates.length === 0) {
        container.textContent = currentSlots.length ? "会員QRを読み取ってください。" : "先に道場QRを読み取り、課金枠を確定してください。";
        updateSendButton();
        return;
      }

      sortedCandidates().forEach(function (candidate) {
        const row = document.createElement("div");
        row.className = "candidate";
        const head = document.createElement("div");
        head.className = "candidate-head";
        const name = document.createElement("span");
        name.className = "candidate-name";
        name.textContent = candidate.member_id + "：" + (candidate.member_name || memberNameMap[candidate.member_id] || "氏名は管理側で確認");
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "danger";
        remove.textContent = "削除";
        remove.disabled = !businessOperationsEnabled || submitting;
        remove.onclick = function () { removeCandidate(candidate.member_id); };
        head.append(name, remove);
        row.appendChild(head);

        const rankRow = document.createElement("div");
        rankRow.className = "rank-row";
        const rankLabel = document.createElement("span");
        rankLabel.textContent = "現在級・段";
        const rankSelect = document.createElement("select");
        buildRankOptions(rankSelect, candidate.current_rank);
        rankSelect.disabled = !businessOperationsEnabled || !candidate.loaded || submitting;
        rankSelect.onchange = function () {
          candidate.current_rank = rankSelect.value;
          candidate.rank_changed = true;
          renderCandidates();
        };
        rankRow.append(rankLabel, rankSelect);
        row.appendChild(rankRow);

        const progress = document.createElement("div");
        progress.className = "progress";
        if (candidate.rank_changed) {
          progress.textContent = "級段位変更後の進捗は、出席登録後に更新します。";
        } else if (candidate.required_training_count > 0) {
          const target = candidate.next_rank || "次回審査";
          progress.textContent = candidate.training_count + "/" + candidate.required_training_count +
            (candidate.examination_ready
              ? "（" + target + "の必要稽古数到達・先生確認）"
              : "（" + target + "まであと " + candidate.remaining_training_count + "回）");
          if (candidate.examination_ready) progress.classList.add("ready");
          else if (candidate.remaining_training_count !== null && candidate.remaining_training_count <= 5) progress.classList.add("near");
        } else {
          progress.textContent = candidate.training_count + "回（審査基準未設定）";
        }
        if (!candidate.rank_changed && candidate.required_training_days > 0) {
          progress.textContent += " ｜日数 " + candidate.training_days + "/" + candidate.required_training_days +
            "日（あと" + candidate.remaining_training_days + "日）";
        }
        row.appendChild(progress);

        if (!candidate.loaded) {
          const status = document.createElement("div");
          status.className = candidate.load_error ? "error" : "warn";
          status.textContent = candidate.load_error || "登録済み状態を読み込み中…";
          row.appendChild(status);
          if (candidate.load_error) {
            const retry = document.createElement("button");
            retry.type = "button";
            retry.textContent = "再取得";
            retry.disabled = !businessOperationsEnabled || submitting;
            retry.onclick = function () {
              candidate.load_error = "";
              renderCandidates();
              addLog(candidate.member_id + " の状態を再取得します。", "warn");
              loadMemberAttendanceState(candidate.member_id);
            };
            row.appendChild(retry);
          }
        }

        const billingRow = document.createElement("div");
        billingRow.className = "rank-row";
        const billingLabel = document.createElement("span");
        billingLabel.textContent = "会費タイプ";
        billingRow.appendChild(billingLabel);
        if (candidate.billing_plan_selected) {
          const fixedPlan = document.createElement("strong");
          fixedPlan.textContent = candidate.billing_plan_name || candidate.billing_plan_id || "登録済み";
          billingRow.appendChild(fixedPlan);
        } else {
          const planSelect = document.createElement("select");
          const emptyPlan = document.createElement("option");
          emptyPlan.value = "";
          emptyPlan.textContent = "月額／都度を選択";
          planSelect.appendChild(emptyPlan);
          candidate.billing_plan_candidates.forEach(function(plan) {
            const option = document.createElement("option");
            option.value = plan.plan_id;
            option.textContent = plan.plan_name || plan.plan_id;
            option.selected = candidate.billing_plan_id === plan.plan_id;
            planSelect.appendChild(option);
          });
          planSelect.disabled = !businessOperationsEnabled || submitting || !candidate.loaded;
          planSelect.onchange = function() {
            candidate.billing_plan_id = planSelect.value;
            renderCandidates();
          };
          billingRow.appendChild(planSelect);
        }
        row.appendChild(billingRow);

        const slots = document.createElement("div");
        slots.className = "slots";
        currentSlots.forEach(function (slot) {
          const button = document.createElement("button");
          const selected = candidate.slot_ids.includes(slot.slot_id);
          button.type = "button";
          button.className = "slot" + (selected ? " selected" : "");
          button.textContent = (slot.start_time && slot.end_time) ? slot.start_time + "–" + slot.end_time : slot.label;
          button.disabled = !businessOperationsEnabled || !candidate.loaded || submitting;
          button.onclick = function () { toggleSlot(candidate.member_id, slot.slot_id); };
          slots.appendChild(button);
        });
        row.appendChild(slots);
        container.appendChild(row);
      });
      updateSendButton();
    }

    function showRegistrationStatus(kind, title, detail) {
      const status = document.getElementById("registrationStatus");
      status.className = "registration-status" + (kind ? " " + kind : "");
      document.getElementById("registrationStatusTitle").textContent = title;
      document.getElementById("registrationStatusDetail").textContent = detail;
    }

    function sendCandidatesToGas() {
      if (!businessOperationsEnabled || submitting) return;
      if (!currentTeacherId || !currentLocationId || !currentBillingBlockId) {
        addLog("先生・道場・課金枠をすべて設定してください。", "error");
        return;
      }
      if (memberCandidates.length === 0) {
        addLog("出席する会員がいません。", "error");
        return;
      }
      const notLoaded = memberCandidates.filter(function (item) { return !item.loaded; });
      if (notLoaded.length > 0) {
        addLog("登録済み状態を確認できていない会員がいます。誤取消防止のため送信できません。", "error");
        return;
      }
      const rankMissing = memberCandidates.filter(function(item) { return !item.current_rank; });
      if (rankMissing.length > 0) {
        addLog("現在級・段を選択してください: " + rankMissing.map(function(item) { return item.member_id; }).join(", "), "error");
        return;
      }
      const billingMissing = memberCandidates.filter(function(item) {
        return item.slot_ids.length > 0 && !item.billing_plan_selected && !item.billing_plan_id;
      });
      if (billingMissing.length > 0) {
        addLog("月額／都度を選択してください: " + billingMissing.map(function(item) { return item.member_id; }).join(", "), "error");
        return;
      }

      const payload = {
        mode: "attendance_batch",
        request_id: "ATTREQ-" + Date.now() + "-" + Math.floor(Math.random() * 100000),
        attendance_session_id: attendanceSessionId,
        attendance_date: currentAttendanceDate(),
        teacher_id: currentTeacherId,
        location_id: currentLocationId,
        billing_block_id: currentBillingBlockId,
        attendance_items: memberCandidates.map(function (item) {
          return {
            member_id: item.member_id,
            current_rank: item.current_rank,
            plan_id: item.billing_plan_id || "",
            slot_ids: item.slot_ids.slice()
          };
        }),
        source: "github_pages_qr"
      };

      const expectedByMember = {};
      payload.attendance_items.forEach(function(item) {
        expectedByMember[item.member_id] = {
          slot_ids: item.slot_ids.slice(),
          current_rank: item.current_rank
        };
      });

      submitting = true;
      showRegistrationStatus("pending", "登録処理中…", "送信と保存結果の照合が完了するまでお待ちください。");
      renderCandidates();
      updateSendButton();
      addLog("出席登録を送信しています。");
      const send = IS_FIREBASE_ATTENDANCE
        ? window.DOJO_ATTENDANCE_FIREBASE_WRITE.register({input:payload,
            runtimeConfig:window.DOJO_RUNTIME_CONFIG,authClient:firebaseAttendanceAuth,apiClient:firebaseAttendanceApi})
        : postJsonViaForm(GAS_URL, payload);
      send.then(function () {
        if (IS_FIREBASE_ATTENDANCE) {
          addLog("出席登録が完了しました。保存結果を再確認します。");
          return refreshAllMemberStates(expectedByMember);
        }
        addLog("送信しました。GASの処理完了を待っています。");
        return waitForPostReceipt(payload.request_id, 1).then(function(receipt) {
          if (!receipt.ok) throw new Error(receipt.message || "GASの出席処理に失敗しました。");
          addLog("GASの処理完了を確認しました。保存結果を再確認します。");
          return refreshAllMemberStates(expectedByMember);
        });
      }).then(function(verified) {
        if (verified === true) {
          showRegistrationStatus("success", "✓ 出席登録が完了しました", "保存結果を再取得し、選択した出席内容との一致を確認しました。");
        } else {
          showRegistrationStatus("failure", "保存結果を確認できません", "送信済みの可能性があります。再登録する前に登録済み状態を確認してください。");
        }
      }).catch(function (error) {
        showRegistrationStatus("failure", "出席登録を確認できません", "通信または保存確認に失敗しました。登録済み状態を確認してから再試行してください。");
        addLog("送信エラー: " + error, "error");
      }).finally(function() {
        submitting = false;
        renderCandidates();
        updateSendButton();
        if (IS_FIREBASE_ATTENDANCE && attendanceClockKey && attendanceBusinessClockKey() !== attendanceClockKey)
          window.dispatchEvent(new Event("dojo-system-context"));
      });
    }

    function postJsonViaForm(url, payload) {
      return new Promise(function(resolve) {
        const targetName = "attendancePost_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        const iframe = document.createElement("iframe");
        iframe.name = targetName;
        iframe.hidden = true;
        const form = document.createElement("form");
        form.method = "POST";
        form.action = url;
        form.target = targetName;
        form.hidden = true;
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "payload";
        input.value = JSON.stringify(payload);
        form.appendChild(input);
        document.body.append(iframe, form);
        form.submit();
        form.remove();
        window.setTimeout(function() {
          resolve();
        }, 100);
        window.setTimeout(function() { iframe.remove(); }, 120000);
      });
    }

    function waitForPostReceipt(requestId, attempt) {
      return jsonp(GAS_URL, { action:"post_receipt", request_id:requestId }).then(function(receipt) {
        if (receipt && receipt.completed) return receipt;
        if (attempt >= 60) throw new Error("GASの処理完了を60秒以内に確認できませんでした。");
        return new Promise(function(resolve) {
          window.setTimeout(function() { resolve(waitForPostReceipt(requestId, attempt + 1)); }, 1000);
        });
      });
    }

    function clearCandidates(silent) {
      if (submitting) return;
      memberCandidates = [];
      attendanceSessionId = createSessionId();
      renderCandidates();
      if (!silent) {
        showRegistrationStatus("", "出席登録の準備", "先生QRと会員QRを読み取り、出席内容を確認してください。");
        addLog("会員一覧をクリアしました。");
      }
    }

    function renderKeys() {
      setKey("locationId", currentLocationId);
      setKey("billingBlockId", currentBillingBlockId);
      setKey("teacherId", currentTeacherId);
      updateSendButton();
    }

    function setKey(id, value) {
      const element = document.getElementById(id);
      element.textContent = value || "未設定";
      element.className = value ? "ok" : "warn";
    }

    function updateSendButton() {
      const sendButton = document.getElementById("sendButton");
      const teacherQrGuide = document.getElementById("teacherQrGuide");
      const waitingForTeacher = !currentTeacherId;

      teacherQrGuide.hidden = !waitingForTeacher;
      sendButton.hidden = waitingForTeacher;
      sendButton.textContent = submitting ? "登録処理中…" : "選択した出席を登録";
      sendButton.disabled = !(
        businessOperationsEnabled && !submitting && currentTeacherId && currentLocationId && currentBillingBlockId &&
        memberCandidates.length > 0 && memberCandidates.every(function (item) { return item.loaded && item.current_rank; })
      );
    }

    function normalizeSlotIds(slotIds) {
      return Array.from(new Set((slotIds || []).map(function(value) {
        return String(value || "").trim();
      }).filter(Boolean))).sort();
    }

    function sortedCandidates() {
      const mode = document.getElementById("candidateSort").value;
      return memberCandidates.map(function(item, index) { return { item:item, index:index }; }).sort(function(left, right) {
        if (mode === "rank") {
          return rankSortValue(left.item.current_rank) - rankSortValue(right.item.current_rank) || left.index - right.index;
        }
        if (mode === "exam") {
          const leftRemaining = left.item.remaining_training_count === null ? 999999 : left.item.remaining_training_count;
          const rightRemaining = right.item.remaining_training_count === null ? 999999 : right.item.remaining_training_count;
          return leftRemaining - rightRemaining || left.index - right.index;
        }
        return left.index - right.index;
      }).map(function(entry) { return entry.item; });
    }

    function buildRankOptions(select, selectedRank) {
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = "選択してください";
      select.appendChild(empty);
      ["成人", "少年"].forEach(function(system) {
        const group = document.createElement("optgroup");
        group.label = system;
        rankOptions.filter(function(rank) { return rank.qualification_system === system; }).forEach(function(rank) {
          const option = document.createElement("option");
          option.value = rank.display_name;
          option.textContent = rank.display_name;
          option.selected = rank.display_name === selectedRank;
          group.appendChild(option);
        });
        if (group.children.length) select.appendChild(group);
      });
      if (selectedRank && !rankOptions.some(function(rank) { return rank.display_name === selectedRank; })) {
        const legacy = document.createElement("option");
        legacy.value = selectedRank;
        legacy.textContent = selectedRank + "（旧表記・要選択）";
        legacy.selected = true;
        select.appendChild(legacy);
      }
    }

    function rankSortValue(rankName) {
      const rank = rankOptions.find(function(option) { return option.display_name === rankName; });
      return rank ? Number(rank.sort_order || 999999) : 999999;
    }

    function slotIdsEqual(left, right) {
      const normalizedLeft = normalizeSlotIds(left);
      const normalizedRight = normalizeSlotIds(right);
      return normalizedLeft.length === normalizedRight.length &&
        normalizedLeft.every(function(value, index) { return value === normalizedRight[index]; });
    }

    function jsonp(url, params) {
      if (IS_FIREBASE_ATTENDANCE) {
        return window.DOJO_ATTENDANCE_FIREBASE_READ.request({
          action:params && params.action,
          params:params,
          runtimeConfig:window.DOJO_RUNTIME_CONFIG,
          authClient:firebaseAttendanceAuth,
          apiClient:firebaseAttendanceApi
        }).catch(function(error) {
          if (attendanceInitializationManager && /HTTP (401|403)\b/.test(String(error && error.message || error))) {
            attendanceInitializationManager.accessLost("authorization_lost");
            document.getElementById("firebaseAttendanceStatus").textContent =
              "この出席操作を行う権限を確認できませんでした: " + (error.message || String(error));
          }
          throw error;
        });
      }
      return new Promise(function (resolve, reject) {
        const callbackName = "attendanceCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        const script = document.createElement("script");
        const query = new URLSearchParams(Object.assign({}, params, { callback: callbackName, _ts: Date.now() }));
        const actionLabel = {
          attendance_session_info: "稽古枠",
          member_attendance_state: "会員状態",
          attendance_rank_options: "級・段一覧",
          post_receipt: "登録結果"
        }[params.action] || "GAS応答";
        const timeout = window.setTimeout(function () {
          cleanup();
          reject(new Error(actionLabel + "の取得がタイムアウトしました。再取得してください。"));
        }, 30000);
        function cleanup() {
          window.clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        }
        window[callbackName] = function (data) { cleanup(); resolve(data); };
        script.onerror = function () { cleanup(); reject(new Error("GASへ接続できませんでした。")); };
        script.src = url + "?" + query.toString();
        document.head.appendChild(script);
      });
    }

    function localDateText(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return year + "-" + month + "-" + day;
    }

    function currentAttendanceDate() {
      const context = window.DOJO_SYSTEM_CONTEXT;
      return context && context.system_now ? String(context.system_now).slice(0, 10) : localDateText(new Date());
    }

    function createSessionId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") return "ASES-" + window.crypto.randomUUID();
      return "ASES-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    function addLog(message, className) {
      const li = document.createElement("li");
      li.textContent = "[" + new Date().toLocaleTimeString() + "] " + message;
      if (className) li.className = className;
      document.getElementById("log").prepend(li);
    }

    function beep(frequency) {
      try {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.connect(gain); gain.connect(context.destination);
        oscillator.frequency.value = frequency || 880; gain.gain.value = 0.08;
        oscillator.start(); oscillator.stop(context.currentTime + 0.08);
      } catch (error) {}
      if (navigator.vibrate) navigator.vibrate(100);
    }
  </script>
  <script src="system_context.js"></script>
</body>
