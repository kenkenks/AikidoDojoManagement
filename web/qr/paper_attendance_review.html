<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>紙の出席記録取込</title><link rel="stylesheet" href="common.css">
  <style>
    .hidden{display:none!important}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar button{margin:0}
    .source-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:14px}.image-stage{position:relative;display:inline-block;max-width:100%;line-height:0}.sheet-image{display:block;max-width:100%;max-height:70vh;background:#eef1f4;border-radius:8px}.corner-layer{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.corner-layer polygon{fill:#2563eb18;stroke:#2563eb;stroke-width:3}.corner-layer circle{fill:#fff;stroke:#dc2626;stroke-width:4;cursor:grab}
    .cell-grid-wrap{overflow:auto}.cell-grid{display:grid;grid-template-columns:repeat(20,minmax(34px,1fr));min-width:700px;border:1px solid #9aa4b2}
    .cell{min-height:36px;margin:0!important;padding:2px!important;border:0;border-right:1px solid #ccd2da;border-bottom:1px solid #ccd2da;border-radius:0!important;font-size:10px;line-height:1.1;background:#fff;color:#27313f}
    .cell.recognized{background:#dff5e8}.cell.review{background:#fff0c7}.cell.empty{background:#f7f8fa;color:#8a94a3}.cell.selected{outline:3px solid #2563eb;outline-offset:-3px}.cell.confirmed::after{content:' ✓';color:#176b45;font-weight:700}
    .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.legend span::before{content:'';display:inline-block;width:13px;height:13px;margin-right:4px;vertical-align:-2px;border:1px solid #aaa}.legend .recognized::before{background:#dff5e8}.legend .review::before{background:#fff0c7}.legend .empty::before{background:#f7f8fa}
    .detail-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}.crop{width:220px;height:150px;border:1px solid #bbb;background:#f5f5f5}.crop canvas{width:100%;height:100%;object-fit:contain}.editor label{display:block;margin-bottom:8px}.editor input[type=text]{width:100%;padding:9px;font-size:16px}
    .summary-table{width:100%;border-collapse:collapse}.summary-table th,.summary-table td{padding:7px;border-bottom:1px solid #ddd;text-align:left}.error{color:#b3261e}.ok{color:#176b45}
    @media(max-width:760px){.source-layout,.detail-grid{grid-template-columns:1fr}.crop{width:100%;height:180px}}
  </style>
</head>
<body class="teacher">
  <h1>📷 紙の出席記録取込</h1>
  <section class="card login-state"><strong id="loginIdentity">先生セッションを確認中</strong><button id="authButton" type="button">管理者ログイン</button></section>
  <section class="card">
    <h2>画像とOCR結果</h2>
    <p class="note">画像と認識結果はこの画面のメモリ内だけで扱います。Firestoreへの登録・送信は行いません。</p>
    <div class="toolbar"><label>帳票画像 <input id="imageFile" type="file" accept="image/*"></label><label>最大辺 <input id="maxDimension" type="number" min="1200" max="4000" step="200" value="2400" style="width:90px">px</label><label>JPEG品質 <input id="jpegQuality" type="number" min="0.55" max="0.98" step="0.01" value="0.86" style="width:75px"></label><button id="runOcrButton" type="button" disabled>OCRを実行</button><button id="clearButton" type="button">画面をクリア</button></div>
    <details><summary>OCR JSONを貼り付ける</summary><textarea id="ocrText" rows="5" style="width:100%" placeholder="paper-attendance-ocr-prototype.cjs のJSON出力"></textarea><button id="applyOcrButton" type="button">認識結果を反映</button></details>
    <div id="message" class="note">帳票画像とOCR結果を選択してください。</div>
  </section>
  <section class="card source-layout">
    <div><h2>元画像・四隅補正</h2><div id="imageStage" class="image-stage"><img id="sheetImage" class="sheet-image" alt="選択した出席管理表"><svg id="cornerLayer" class="corner-layer hidden" viewBox="0 0 1000 1000" preserveAspectRatio="none"><polygon id="cornerPolygon"></polygon><circle data-corner="0" r="18"></circle><circle data-corner="1" r="18"></circle><circle data-corner="2" r="18"></circle><circle data-corner="3" r="18"></circle></svg></div><p class="note">赤い四隅を表の外周へ合わせると、OCR結果を再割付します。手動修正済みセルは保持されます。</p></div>
    <div><h2>確認状況</h2><p id="progress"></p><div class="legend"><span class="recognized">認識済み</span><span class="review">要確認</span><span class="empty">空白</span></div><p><button id="confirmBlankButton" type="button">空白セルを一括確認</button></p><p class="note">日付は同じ値でもセルごとに保持します。</p></div>
  </section>
  <section class="card"><h2>20×20 認識結果</h2><div class="cell-grid-wrap"><div id="cellGrid" class="cell-grid"></div></div></section>
  <section class="card detail-grid">
    <div class="crop"><canvas id="cropCanvas" width="440" height="300"></canvas></div>
    <div class="editor"><h2 id="cellTitle">セルを選択してください</h2><label>認識文字<input id="rawText" type="text" readonly></label><label>出席日付<input id="dateValue" type="text" inputmode="numeric" placeholder="YYYY-MM-DD または M/D"></label><label><input id="confirmed" type="checkbox"> このセルを確認済みにする</label><div class="toolbar"><button id="saveCellButton" type="button">セルを反映</button><button id="clearCellButton" type="button">空白にする</button></div></div>
  </section>
  <section id="attendanceSummary" class="card hidden"><h2>日付別の出席回数</h2><table class="summary-table"><thead><tr><th>日付</th><th>稽古回数</th></tr></thead><tbody id="summaryBody"></tbody></table></section>
  <p class="note"><a id="teacherHomeLink" href="teacher_home.html">先生ホームへ戻る</a></p>
  <script src="virtual_session.js"></script><script src="runtime_config.js"></script><script src="firebase_auth.js"></script><script src="dojo_api_client.js"></script><script src="paper_attendance_review.js"></script>
</body></html>
