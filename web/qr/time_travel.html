<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>テスト日時操作</title>
  <style>
    :root { color-scheme: light; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; background:#f5f5f7; color:#222; }
    main { max-width:520px; margin:0 auto; padding:18px 16px 40px; }
    h1 { font-size:24px; margin:4px 0 14px; }
    .warning { padding:12px; background:#fff1d6; border:1px solid #e0a43a; border-radius:10px; line-height:1.5; }
    .card { margin-top:14px; padding:16px; background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    label { display:block; margin-top:14px; font-weight:700; }
    input[type="datetime-local"], input[type="month"] { width:100%; box-sizing:border-box; margin-top:6px; padding:12px; font-size:17px; border:1px solid #bbb; border-radius:9px; background:#fff; }
    .check { display:flex; align-items:center; gap:9px; margin-top:0; }
    .check input { width:22px; height:22px; }
    .row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
    button { width:100%; min-height:46px; margin-top:12px; padding:10px; font-size:16px; border:1px solid #aaa; border-radius:9px; background:#fff; }
    button.primary { color:#fff; background:#b65f00; border-color:#944e00; font-weight:700; }
    button:disabled { opacity:.55; }
    #status { white-space:pre-line; line-height:1.55; font-size:16px; }
    .diagnostic-log { white-space:pre-wrap; overflow-wrap:anywhere; background:#171b23; color:#e7edf6; padding:12px; border-radius:8px; max-height:350px; overflow:auto; font:12px/1.6 Consolas,monospace; }
    .small { color:#666; font-size:13px; line-height:1.5; }
  </style>
</head>
<body>
<main>
  <h1>テスト日時操作</h1>
  <div class="warning">DEV/TEST用の孤立ページです。設定は全画面へ共通で反映されます。E2E終了後は「実時刻へ戻す」を実行してください。</div>

  <section id="authCard" class="card" hidden>
    <div id="authStatus">Googleアカウントでログインしてください。</div>
    <button id="loginButton" type="button" onclick="loginWithGoogle()">Googleでログイン</button>
  </section>

  <section class="card">
    <label class="check"><input id="enabled" type="checkbox">タイムトリップを有効にする</label>
    <label for="systemNow">テスト日時</label>
    <input id="systemNow" type="datetime-local" step="1">
    <div class="row">
      <button type="button" onclick="shiftDays(-1)">−1日</button>
      <button type="button" onclick="shiftDays(1)">＋1日</button>
      <button type="button" onclick="shiftDays(7)">＋7日</button>
    </div>
    <label for="targetMonth">対象月</label>
    <input id="targetMonth" type="month">
    <div class="small">日付を変更すると対象月も自動で合わせます。必要なら手動変更できます。</div>
    <button id="saveButton" class="primary" type="button" onclick="save()">設定を保存</button>
    <button id="resetButton" type="button" onclick="resetRealTime()">実時刻へ戻す</button>
  </section>

  <section class="card"><div id="status">読み込み中です。</div></section>

  <section class="card">
    <h2>ベースチェック（読み取り専用）</h2>
    <div class="small">本体画面の未検証項目はPASSにしません。ログには認証トークンを記録しません。</div>
    <button id="runBaseCheck" type="button" onclick="runBaseCheck()">診断実行</button>
    <button type="button" onclick="copyBaseCheckLog()">診断ログをコピー</button>
    <div id="baseCheckSummary" role="status">未実行</div>
    <pre id="baseCheckLog" class="diagnostic-log" aria-live="polite">診断を実行してください。</pre>
  </section>

  <section id="teacherHomeLink" class="card" hidden>
    <a href="teacher_home.html?teacher_id=T001">
      🥋 先生ホーム（T001・動作確認用）
    </a>

</section>
</main>
<script src="runtime_config.js"></script>
<script src="firebase_auth.js"></script>
<script src="dojo_api_client.js"></script>
<script>
  const RUNTIME_CONFIG = window.DOJO_RUNTIME_CONFIG;
  const GAS_URL = RUNTIME_CONFIG.apiBaseUrl;
  const IS_FIREBASE = RUNTIME_CONFIG.runtime === "firebase";
  const firebaseAuthClient = IS_FIREBASE ? window.DOJO_FIREBASE_AUTH.create({ runtimeConfig:RUNTIME_CONFIG }) : null;
  const dojoApiClient = IS_FIREBASE ? window.DOJO_API_CLIENT.create({ getCurrentUser:firebaseAuthClient.getCurrentUser }) : null;

  let callbackSeq = 0;
  let baseCheckLines = [];
  function baseLog(level, name, detail) {
    const line = new Date().toLocaleTimeString("ja-JP", { hour12:false }) + " " + level + " " + name + (detail ? " | " + detail : "");
    baseCheckLines.push(line);
    document.getElementById("baseCheckLog").textContent = baseCheckLines.join("\n");
  }
  async function runBaseCheck() {
    const button = document.getElementById("runBaseCheck");
    button.disabled = true;
    baseCheckLines = [];
    const counts = { PASS:0, WARN:0, FAIL:0, NOT_TESTED:0 };
    function result(level, name, detail) { counts[level]++; baseLog(level, name, detail); }
    try {
      result(RUNTIME_CONFIG && RUNTIME_CONFIG.apiBaseUrl ? "PASS" : "FAIL", "runtime_config", String(RUNTIME_CONFIG && RUNTIME_CONFIG.runtime));
      if (!IS_FIREBASE) {
        result("NOT_TESTED", "Firebase Auth / API / Firestore", "GAS target");
      } else {
        await firebaseAuthClient.ready;
        const user = firebaseAuthClient.getCurrentUser();
        if (!user) {
          result("FAIL", "Firebase Auth", "ログインが必要です");
          result("NOT_TESTED", "Cloud Run / Firestore", "認証未完了");
        } else {
          result("PASS", "Firebase Auth", "signed in (user details omitted)");
          try {
            const response = await dojoApiClient.request(firebaseApiUrl("/api/admin/time-travel"), { method:"GET" });
            if (!response.ok) {
              result("FAIL", "Cloud Run / TimeTrip API", "HTTP " + response.status);
              result("NOT_TESTED", "Firestore read", "API request failed");
            } else {
              const data = await response.json();
              result(data && data.ok === true ? "PASS" : "FAIL", "Cloud Run / TimeTrip API", "HTTP " + response.status);
              result(data && data.ok === true ? "PASS" : "NOT_TESTED", "Firestore read", "TimeTrip setting read; other collections not tested");
            }
          } catch (error) {
            result("FAIL", "Cloud Run / TimeTrip API", error && error.message || String(error));
            result("NOT_TESTED", "Firestore read", "API request failed");
          }
        }
      }
      try {
        const response = await fetch("base_check_manifest.json", { cache:"no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const manifest = await response.json();
        result("PASS", "build manifest", manifest.target + " / " + manifest.screens.length + " screens inventoried");
        for (const screen of manifest.screens) {
          result(screen.status === "WARN" ? "WARN" : "NOT_TESTED", screen.name,
            screen.detail + "; apiClient=" + screen.apiClient + "; firebaseAuth=" + screen.firebaseAuth);
        }
      } catch (error) {
        result("WARN", "build manifest", "未配置または取得不可: " + (error && error.message || String(error)));
      }
    } catch (error) { result("FAIL", "base checker", error && error.message || String(error)); }
    finally {
      document.getElementById("baseCheckSummary").textContent = Object.keys(counts).map(k => k + ": " + counts[k]).join(" / ");
      button.disabled = false;
    }
  }
  function copyBaseCheckLog() {
    const log = document.getElementById("baseCheckSummary").textContent + "\n" + baseCheckLines.join("\n");
    navigator.clipboard.writeText(log).catch(function(error) { baseLog("WARN", "clipboard", error.message); });
  }


  document.getElementById("systemNow").addEventListener("change", syncTargetMonthFromDate);
  if (IS_FIREBASE) {
    firebaseAuthClient.ready.then(function() {
      updateAuthUi(firebaseAuthClient.getCurrentUser());
      firebaseAuthClient.onUserChanged(function(user) {
        updateAuthUi(user);
        if (user) loadSetting();
      });
      if (firebaseAuthClient.getCurrentUser()) loadSetting();
      else { setBusy(false); setStatus("Googleアカウントでログインしてください。"); }
    }).catch(showError);
  } else {
    loadSetting();
  }

  function loginWithGoogle() {
    if (!IS_FIREBASE) return;
    const button = document.getElementById("loginButton");
    button.disabled = true;
    setStatus("Googleログインを開始します…");
    firebaseAuthClient.signInWithGoogle().catch(function(error) {
      showError(error);
    }).finally(function() {
      button.disabled = false;
    });
  }

  function updateAuthUi(user) {
    if (!IS_FIREBASE) return;

    document.getElementById("authCard").hidden = !!user;

    // Firebaseログイン後のみ先生ホームへのリンクを表示
    document.getElementById("teacherHomeLink").hidden = !user;

    document.getElementById("authStatus").textContent =
      user ? "" : "Googleアカウントでログインしてください。";
  }

  function loadSetting(message) {
    setBusy(true);
    loadSettingData().then(function(data) {
      if (!data || data.ok !== true) throw new Error((data && data.message) || "設定を取得できませんでした。");
      document.getElementById("enabled").checked = data.enabled === true;
      if (data.now) document.getElementById("systemNow").value = toLocalInput(data.now);
      document.getElementById("targetMonth").value = data.target_month || "";
      showEffective(data.effective, message || "設定を読み込みました。");
    }).catch(showError).finally(function(){ setBusy(false); });
  }

  function loadSettingData() {
    if (!IS_FIREBASE) return jsonp(GAS_URL, { action:"time_travel_admin" });
    return firebaseAuthClient.ready.then(function() {
      return dojoApiClient.request(firebaseApiUrl("/api/admin/time-travel"));
    }).then(function(response) {
      if (!response.ok) throw new Error("設定取得APIでエラーが発生しました。HTTP " + response.status);
      return response.json();
    });
  }

  function firebaseApiUrl(path) {
    return String(RUNTIME_CONFIG.apiBaseUrl || "").replace(/\/+$/, "") + path;
  }

  function save() {
    const value = document.getElementById("systemNow").value;
    const enabled = document.getElementById("enabled").checked;
    const payload = {
      mode:"time_travel_set",
      enabled:enabled,
      now:value ? new Date(value).toISOString() : "",
      target_month:document.getElementById("targetMonth").value
    };
    if (enabled && !value) return setStatus("テスト日時を指定してください。");
    if (enabled && !payload.target_month) return setStatus("対象月を指定してください。");
    postAndVerify(payload, "テスト日時を設定しました。");
  }

  function resetRealTime() {
    document.getElementById("enabled").checked = false;
    postAndVerify({ mode:"time_travel_set", enabled:false, now:"", target_month:"" }, "実時刻へ戻しました。");
  }

  function postAndVerify(payload, successMessage) {
    setBusy(true);
    setStatus("保存中です…");
    if (IS_FIREBASE) {
      const firebasePayload = {
        enabled:payload.enabled === true,
        now:payload.now || "",
        target_month:payload.target_month || ""
      };
      firebaseAuthClient.ready.then(function() {
        return dojoApiClient.request(firebaseApiUrl("/api/admin/time-travel"), {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify(firebasePayload)
        });
      }).then(function(response) {
        if (!response.ok) throw new Error("設定保存APIでエラーが発生しました。HTTP " + response.status);
        return response.json();
      }).then(function(data) {
        if (!data || data.ok !== true) throw new Error((data && data.message) || "設定を保存できませんでした。");
        loadSetting(successMessage);
      }).catch(function(error) {
        setBusy(false);
        showError(error);
      });
      return;
    }

    fetch(GAS_URL, {
      method:"POST",
      mode:"no-cors",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify(payload)
    }).then(function() {
      // no-corsではPOST応答本文を読めないため、GETで実効値を再取得して確認する。
      return wait(700);
    }).then(function() {
      loadSetting(successMessage);
    }).catch(function(error) {
      setBusy(false);
      showError(error);
    });
  }

  function shiftDays(days) {
    const input = document.getElementById("systemNow");
    let d = input.value ? new Date(input.value) : new Date();
    d.setDate(d.getDate() + days);
    input.value = toLocalInput(d.toISOString());
    document.getElementById("enabled").checked = true;
    syncTargetMonthFromDate();
  }

  function syncTargetMonthFromDate() {
    const value = document.getElementById("systemNow").value;
    if (value && /^\d{4}-\d{2}/.test(value)) document.getElementById("targetMonth").value = value.slice(0,7);
  }

  function showEffective(effective, message) {
    if (!effective) return setStatus(message || "設定を取得しました。");
    setStatus((message ? message + "\n" : "") +
      "システム日時: " + effective.system_now + "\n" +
      "対象月: " + effective.target_month + "\n" +
      "状態: " + (effective.time_travel_enabled ? "テスト時刻" : "実時刻"));
  }

  function jsonp(url, params) {
    return new Promise(function(resolve, reject) {
      const callback = "__timeTravelCallback" + (++callbackSeq);
      const script = document.createElement("script");
      const timer = setTimeout(function(){ cleanup(); reject(new Error("GAS応答がタイムアウトしました。")); }, 20000);
      function cleanup() { clearTimeout(timer); delete window[callback]; if (script.parentNode) script.parentNode.removeChild(script); }
      window[callback] = function(data) { cleanup(); resolve(data); };
      const query = Object.keys(params).map(function(k){ return encodeURIComponent(k)+"="+encodeURIComponent(params[k]); });
      query.push("callback=" + encodeURIComponent(callback));
      script.src = url + "?" + query.join("&") + "&_=" + Date.now();
      script.onerror = function(){ cleanup(); reject(new Error("GASへ接続できませんでした。")); };
      document.head.appendChild(script);
    });
  }

  function toLocalInput(iso) {
    const date = new Date(iso);
    const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0,19);
  }
  function wait(ms) { return new Promise(function(resolve){ setTimeout(resolve, ms); }); }
  function setBusy(busy) { document.getElementById("saveButton").disabled = busy; document.getElementById("resetButton").disabled = busy; }
  function setStatus(text) { document.getElementById("status").textContent = text; }
  function showError(error) { setStatus("エラー: " + ((error && error.message) || String(error))); }
</script>
</body>
</html>
