<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR生成</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="assets/qr-sheet.css" media="print">
  <style>
    .type-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:9px; }
    .type-button {
      border:1px solid #b8c4cf;
      background:#fff;
      color:#203040;
      border-radius:10px;
      padding:13px 10px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
    }
    .type-button.active { outline:3px solid #97b8d3; background:#eef6fc; }
    .type-button.member.active { outline-color:#99cdbb; background:#eef9f4; }
    .type-button.monthly.active { outline-color:#e8b46f; background:#fff6e8; }
    .type-button.onetime.active { outline-color:#e4cf72; background:#fffbea; }
    .type-button.admin.active { outline-color:#b9bec4; background:#f2f3f4; }

    .field { margin:12px 0; }
    .field label { display:block; color:#555; font-size:13px; margin-bottom:5px; }
    .field select {
      width:100%;
      padding:10px;
      font-size:16px;
      background:#fff;
    }
    .hidden { display:none !important; }
    .loading { color:#0b5cad; }
    .error { color:#b3261e; font-weight:bold; }
    .summary {
      border-left:5px solid #97b8d3;
      background:#f7fafc;
      padding:11px 13px;
      line-height:1.7;
      border-radius:7px;
    }
    .summary strong { display:inline-block; min-width:7em; }
    .next-button { width:100%; margin-top:10px; }
    .action-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
    .action-row button { width:100%; }
    .print-list { list-style:none; padding:0; margin:10px 0; }
    .print-list-item {
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:10px;
      padding:9px 0;
      border-bottom:1px solid #d7dee5;
    }
    .print-list-name { font-weight:bold; }
    .print-list-url { color:#667; font-size:11px; word-break:break-all; }
    #printDocument { display:none; }
    @media (min-width:700px) {
      body { max-width:760px; margin:0 auto; }
      .type-grid { grid-template-columns:repeat(5, minmax(0, 1fr)); }
    }
    @page { size:B5 landscape; margin:0; }
    @media print {
      html, body { width:257mm; height:182mm; margin:0; padding:0; background:#fff; }
      body > :not(#printDocument) { display:none !important; }
      #printDocument { display:block; }
      .print-page {
        box-sizing:border-box;
        width:257mm;
        height:182mm;
        padding:2mm;
        display:grid;
        grid-template-columns:repeat(4, 1fr);
        grid-template-rows:repeat(2, 1fr);
        gap:1mm;
        break-after:page;
        page-break-after:always;
      }
      .print-page:last-child { break-after:auto; page-break-after:auto; }
      .print-card {
        box-sizing:border-box;
        min-width:0;
        min-height:0;
        border:0.25mm dashed #777;
        display:grid;
        place-items:center;
        overflow:hidden;
      }
      .print-card-shell {
        position:relative;
        width:62.3mm;
        height:88.4mm;
        overflow:hidden;
      }
      .print-card-shell > .qr-sheet {
        position:absolute;
        inset:0 auto auto 0;
        margin:0;
        page:auto;
        border-radius:2.6mm;
        box-shadow:none;
        transform:scale(.842) !important;
        transform-origin:top left !important;
      }
      .print-card-shell .qr-frame img { width:37mm; height:37mm; }
      .print-location {
        margin-top:.8mm;
        color:var(--sf-teacher);
        font-size:4mm;
        line-height:1.3;
        font-weight:800;
        overflow-wrap:anywhere;
      }
    }
  </style>
</head>
<body class="teacher">
  <h1>🔳 QR生成</h1>
  <p class="note"><a href="teacher_home.html">先生ホームへ戻る</a></p>

  <section class="card login-state">
    <strong id="loginIdentity">先生情報を確認中...</strong>
    <button id="firebaseLoginButton" type="button" class="hidden">管理者としてGoogleログイン</button>
  </section>

  <section class="card">
    <h2>1. QRの種類</h2>
    <div class="type-grid">
      <button class="type-button member active" data-type="MEMBER_CARD">会員カード</button>
      <button class="type-button monthly" data-type="PAYMENT_MONTHLY">月謝</button>
      <button class="type-button onetime" data-type="PAYMENT_ONETIME">都度支払い</button>
      <button class="type-button admin" data-type="DOJO">道場</button>
      <button class="type-button admin" data-type="TEACHER">先生＋道場</button>
    </div>
  </section>

  <section class="card">
    <h2>2. 発行対象</h2>
    <div id="loadMessage" class="note loading">マスタを読み込み中です。</div>

    <div id="memberField" class="field hidden">
      <label for="memberSelect">会員</label>
      <select id="memberSelect"></select>
    </div>

    <div id="planField" class="field hidden">
      <label for="planSelect">料金プラン</label>
      <select id="planSelect"></select>
      <div id="planRuleMessage" class="note"></div>
    </div>

    <div id="locationField" class="field hidden">
      <label for="locationSelect">道場</label>
      <select id="locationSelect"></select>
    </div>

    <div id="teacherField" class="field hidden">
      <label for="teacherSelect">先生</label>
      <select id="teacherSelect"></select>
    </div>
  </section>

  <section class="card">
    <h2>3. 選択内容</h2>
    <div id="selectionSummary" class="summary">マスタ読込後に表示します。</div>
    <button id="previewButton" class="next-button" type="button" disabled>プレビューへ</button>
    <p class="note">5種類ともFunctional Prototypeとしてプレビュー・印刷できます。帳票デザインは後工程で調整します。</p>
  </section>

  <section class="card">
    <h2>4. B5印刷リスト</h2>
    <div class="action-row">
      <button id="addToPrintListButton" type="button" disabled>選択中のQRを追加</button>
      <button id="clearPrintListButton" type="button" disabled>全件クリア</button>
    </div>
    <p id="printListSummary" class="note">0枚（B5 0ページ）</p>
    <ol id="printList" class="print-list"></ol>
    <button id="printPdfButton" class="next-button" type="button" disabled>B5 PDF／印刷</button>
    <p class="note">印刷画面では倍率を「100%／実際のサイズ」、余白を「なし」にしてください。PDF保存も同じ設定です。</p>
  </section>

  <section class="card"><h2>診断ログ</h2><pre id="operationLog" style="white-space:pre-wrap;word-break:break-word;margin:0;"></pre></section>
  <div id="printDocument" aria-hidden="true"></div>
  <script src="virtual_session.js"></script>
  <script src="runtime_config.js"></script>
  <script src="firebase_auth.js"></script>
  <script src="auth_gate.js"></script>
  <script src="page_initialization_manager.js"></script>
  <script src="dojo_api_client.js"></script>
  <script src="qr_generator.js"></script>
  <script>
    const qrLogStartedAt = performance.now();
    function qrLog(step, detail) {
      const line = "[QR " + step + " +" + Math.round(performance.now() - qrLogStartedAt) + "ms] " + (detail || "");
      const root = document.getElementById("operationLog");
      if (root) root.textContent = line + "\n" + root.textContent;
      console.log(line);
    }
    qrLog("01", "init start; runtime=" + String((window.DOJO_RUNTIME_CONFIG || {}).runtime || "unknown"));
    const RUNTIME_CONFIG = window.DOJO_RUNTIME_CONFIG;
    const IS_FIREBASE = RUNTIME_CONFIG.runtime === "firebase";
    const GAS_URL = RUNTIME_CONFIG.apiBaseUrl;
    const firebaseAuthClient = IS_FIREBASE ? window.DOJO_FIREBASE_AUTH.create({ runtimeConfig:RUNTIME_CONFIG }) : null;
    const dojoApiClient = IS_FIREBASE ? window.DOJO_API_CLIENT.create({ getCurrentUser:firebaseAuthClient.getCurrentUser }) : null;
    const qrAuthGate = IS_FIREBASE ? window.DOJO_AUTH_GATE.create({authClient:firebaseAuthClient,runtimeConfig:RUNTIME_CONFIG,loginPath:'index.html'}) : null;
    let qrInitializationManager = null;
    let qrAuthUid = '';
    let qrRedirectStarted = false;
    let qrOperationsEnabled = !IS_FIREBASE;
    qrLog("02", "apiBaseUrl configured=" + !!GAS_URL);
    let qrType = "MEMBER_CARD";
    let options = null;
    let printItems = [];
    const qrStateByUid = new Map();
    let pendingQrSelections = null;

    const teacherSession = DojoVirtualSession.get();
    qrLog("03", "session role=" + (teacherSession ? teacherSession.role : "none") + " teacher_id present=" + !!(teacherSession && teacherSession.teacher_id));
    if (IS_FIREBASE) {
      // Firebase mode is admin-only until teacher identity is verified server-side.
      const loginButton = document.getElementById("firebaseLoginButton");
      loginButton.classList.remove("hidden");
      loginButton.addEventListener("click", function() {
        redirectQrLogin();
      });
      setQrOperationsEnabled(false);
      qrInitializationManager=window.DOJO_PAGE_INITIALIZATION_MANAGER.create({
        dependencies:[{name:'auth',run:function(){return qrAuthGate.requireAuthenticated();}}],
        requiredTasks:[{name:'qrOptions',capability:'qrOptions',run:function(context){return loadOptions(context,true);}}],
        stopOperations:function(){setQrOperationsEnabled(false);}
      });
      qrInitializationManager.subscribe(function(state){
        if(state.status==='READY')setQrOperationsEnabled(true);
        else if(state.status==='ERROR'&&state.error&&state.error.code!=='UNAUTHENTICATED')showQrInitializationError(state.error);
      });
      qrAuthGate.subscribe(function(state){
        if(state.status==='UNAUTHENTICATED'){
          qrInitializationManager.accessLost('authentication_lost');qrAuthUid='';loginButton.classList.remove('hidden');
          document.getElementById('loginIdentity').textContent='QR生成にはFirebase管理者ログインが必要です.';redirectQrLogin();
        }else if(state.status==='AUTHENTICATED'){
          loginButton.classList.add('hidden');document.getElementById('loginIdentity').textContent='Googleログイン済み（管理者権限を確認中）';
          const uid=String(state.user&&state.user.uid||'');
          if(qrAuthUid&&uid&&uid!==qrAuthUid){qrInitializationManager.accessLost('authenticated_user_changed');switchQrOwner(qrAuthUid,uid);qrInitializationManager.retry('authenticated_user_changed').catch(showQrInitializationError);}
          qrAuthUid=uid;
        }else if(state.status==='ERROR'){
          qrInitializationManager.accessLost('authentication_error');showQrInitializationError(state.error);
        }
      });
      qrInitializationManager.start().catch(function(error){if(error&&error.code!=='UNAUTHENTICATED')showQrInitializationError(error);});
    } else if (!teacherSession || teacherSession.role !== "TEACHER") {
      document.getElementById("loginIdentity").textContent = "先生ログインが必要です。";
      document.getElementById("loadMessage").className = "note error";
      document.getElementById("loadMessage").textContent = "先生ホームから開いてください。";
    } else {
      document.getElementById("loginIdentity").textContent =
        "先生 " + teacherSession.teacher_id + " でログイン中";
      qrLog("04", "teacher session accepted; load options");
      loadOptions();
    }

    document.querySelectorAll(".type-button").forEach(function(button) {
      button.addEventListener("click", function() {
        qrType = button.dataset.type;
        document.querySelectorAll(".type-button").forEach(function(item) {
          item.classList.toggle("active", item === button);
        });
        renderFields();
      });
    });

    document.getElementById("memberSelect").addEventListener("change", function() {
      renderFields();
    });
    ["planSelect", "locationSelect", "teacherSelect"].forEach(function(id) {
      document.getElementById(id).addEventListener("change", renderSummary);
    });

    document.getElementById("previewButton").addEventListener("click", openPreview);
    document.getElementById("addToPrintListButton").addEventListener("click", addCurrentQrToPrintList);
    document.getElementById("clearPrintListButton").addEventListener("click", function() {
      printItems.length = 0;
      renderPrintList();
    });
    document.getElementById("printPdfButton").addEventListener("click", printB5Pdf);
    document.getElementById("printList").addEventListener("click", function(event) {
      const button = event.target.closest("button[data-print-index]");
      if (!button) return;
      printItems.splice(Number(button.dataset.printIndex), 1);
      renderPrintList();
    });

    function loadOptions(managerContext,propagate) {
      qrLog("05", "qr_generator_options request start");
      (IS_FIREBASE ? loadFirebaseOptions() : jsonp(GAS_URL, { action:"qr_generator_options" }))
        .then(function(result) {
          if(managerContext&&!managerContext.isCurrent())return false;
          if (!result || result.ok !== true) {
            throw new Error((result && result.message) || "QR生成用マスタを取得できませんでした。");
          }
          qrLog("06", "options received: members=" + (result.members || []).length + " monthly=" + (result.monthly_plans || []).length + " onetime=" + (result.onetime_plans || []).length + " locations=" + (result.locations || []).length + " teachers=" + (result.teachers || []).length);
          options = result;
          populateSelect(
            "memberSelect",
            result.members || [],
            "member_id",
            function(row) { return row.member_id + "｜" + (row.member_name || "氏名未設定") + (row.member_type ? "（" + row.member_type + "）" : ""); }
          );
          populateSelect(
            "locationSelect",
            result.locations || [],
            "location_id",
            function(row) { return row.location_id + "｜" + row.location_name; }
          );
          populateSelect(
            "teacherSelect",
            result.teachers || [],
            "teacher_id",
            function(row) { return row.teacher_id + "｜" + row.teacher_name + (row.role_name ? "（" + row.role_name + "）" : ""); }
          );

          if(pendingQrSelections){
            for(const [id,value] of [['memberSelect',pendingQrSelections.member],['locationSelect',pendingQrSelections.location],['teacherSelect',pendingQrSelections.teacher]]){
              const select=document.getElementById(id);if([...select.options].some(option=>option.value===value))select.value=value;
            }
          }

          const currentTeacherId = teacherSession && teacherSession.teacher_id;
          if (currentTeacherId && !document.getElementById("teacherSelect").value) document.getElementById("teacherSelect").value = currentTeacherId;

          document.getElementById("loadMessage").className = "note";
          document.getElementById("loadMessage").textContent =
            "会員 " + (result.members || []).length + "名 ／ 月謝 " + (result.monthly_plans || []).length +
            "件 ／ 都度 " + (result.onetime_plans || []).length + "件 ／ 道場 " +
            (result.locations || []).length + "件 ／ 先生 " + (result.teachers || []).length + "名";
          renderFields();
          if(pendingQrSelections){const plan=document.getElementById('planSelect');if([...plan.options].some(option=>option.value===pendingQrSelections.plan))plan.value=pendingQrSelections.plan;pendingQrSelections=null;renderSummary();}
          qrLog("07", "options rendered");
          return true;
        })
        .catch(function(error) {
          if(managerContext&&!managerContext.isCurrent())return false;
          if(IS_FIREBASE&&qrInitializationManager&&/HTTP (401|403)/.test(String(error&&error.message||error)))qrInitializationManager.accessLost('authorization_lost');
          qrLog("E1", "options request failed: " + String(error && error.message || error));
          document.getElementById("loadMessage").className = "note error";
          document.getElementById("loadMessage").textContent = error.message || String(error);
          if(propagate)throw error;
          return false;
        });
    }

    function setQrOperationsEnabled(enabled) {
      qrOperationsEnabled=enabled===true;
      ['memberSelect','planSelect','locationSelect','teacherSelect'].forEach(function(id){
        const element=document.getElementById(id);if(element)element.disabled=!qrOperationsEnabled;
      });
      document.querySelectorAll('.type-button').forEach(function(button){button.disabled=!qrOperationsEnabled;});
      if(qrOperationsEnabled){renderFields();renderPrintList();}
      else ['previewButton','addToPrintListButton','clearPrintListButton','printPdfButton'].forEach(function(id){const element=document.getElementById(id);if(element)element.disabled=true;});
    }

    function redirectQrLogin(){
      if(!qrAuthGate||qrRedirectStarted)return;
      qrRedirectStarted=true;qrAuthGate.redirectToLogin(window.location.href);
    }

    function showQrInitializationError(error){
      document.getElementById('loadMessage').className='note error';
      document.getElementById('loadMessage').textContent=error&&error.message||String(error||'初期化に失敗しました。');
    }

    function switchQrOwner(previousUid,nextUid){
      if(previousUid)qrStateByUid.set(previousUid,{qrType:qrType,printItems:printItems.slice(),selections:{member:valueOf('memberSelect'),plan:valueOf('planSelect'),location:valueOf('locationSelect'),teacher:valueOf('teacherSelect')}});
      const saved=qrStateByUid.get(nextUid)||null;
      qrType=saved?saved.qrType:'MEMBER_CARD';printItems=saved?saved.printItems.slice():[];pendingQrSelections=saved?saved.selections:null;options=null;
      for(const id of ['memberSelect','planSelect','locationSelect','teacherSelect'])document.getElementById(id).replaceChildren();
      document.querySelectorAll('.type-button').forEach(function(button){button.classList.toggle('active',button.dataset.type===qrType);});
      document.getElementById('selectionSummary').textContent='新しい利用者のマスターを読み込んでいます。';
      renderPrintList();
    }

    function renderFields() {
      if (!options) return;
      setVisible("memberField", qrType === "MEMBER_CARD" || qrType === "PAYMENT_MONTHLY" || qrType === "PAYMENT_ONETIME");
      setVisible("planField", qrType === "PAYMENT_MONTHLY" || qrType === "PAYMENT_ONETIME");
      setVisible("locationField", qrType === "DOJO" || qrType === "TEACHER");
      setVisible("teacherField", qrType === "TEACHER");

      if (qrType === "PAYMENT_MONTHLY") {
        populateAllowedPlans("月会費");
      } else if (qrType === "PAYMENT_ONETIME") {
        populateAllowedPlans("回数料金");
      } else {
        document.getElementById("planRuleMessage").textContent = "";
      }
      renderSummary();
    }

    function populateAllowedPlans(feeType) {
      const result = resolveSelectablePlans(feeType);
      const message = document.getElementById("planRuleMessage");

      populateSelect("planSelect", result.candidates, "plan_id", planLabel);

      if (!result.member) {
        message.textContent = "会員を選択してください。";
        message.className = "note";
        return;
      }

      if (result.rulePlanIds.length === 0) {
        message.textContent =
          "区分「" + result.memberType +
          "」の料金プラン選択ルールがありません。";
        message.className = "note error";
        return;
      }

      if (result.candidates.length === 0) {
        message.textContent =
          "区分「" + result.memberType + "」の許可プラン[" +
          result.rulePlanIds.join(", ") + "]に、" +
          feeType + "の料金プランがありません。";
        message.className = "note error";
        return;
      }

      if (result.candidates.length === 1) {
        message.textContent =
          "区分「" + result.memberType + "」→ " +
          result.candidates[0].plan_id + " の1件です。";
        message.className = "note";
        return;
      }

      message.textContent =
        "区分「" + result.memberType + "」の候補を" +
        result.candidates.length + "件に制限しています。";
      message.className = "note";
    }

    /*
     * 全会員区分共通の料金プラン候補抽出。
     *
     * 唯一の対応ルール:
     *   01_会員マスタ.区分
     *      ↓
     *   03_料金プラン選択ルール
     *      ↓
     *   selectable_plan_id[]
     *      ↓
     *   03_料金マスタ.plan_id
     *
     * 03_料金マスタ.区分は eligibility 判定には使用しない。
     * 一般/子供/大学生/家族n/ビジター等の個別ifも持たない。
     */
    function resolveSelectablePlans(feeType) {
      const member = selectedRow(
        options.members || [],
        "member_id",
        valueOf("memberSelect")
      );

      if (!member) {
        return {
          member: null,
          memberType: "",
          rulePlanIds: [],
          candidates: []
        };
      }

      const memberType = normalizeRuleKey(member.member_type);

      const rulePlanIds = (options.plan_selection_rules || [])
        .filter(function(rule) {
          return normalizeRuleKey(rule.member_type) === memberType;
        })
        .map(function(rule) {
          return String(rule.selectable_plan_id || "").trim();
        })
        .filter(Boolean);

      const allowedIds = new Set(rulePlanIds);

      const candidates = (options.plans || []).filter(function(plan) {
        return allowedIds.has(String(plan.plan_id || "").trim()) &&
               String(plan.fee_type || "").trim() === feeType;
      });

      return {
        member: member,
        memberType: memberType,
        rulePlanIds: rulePlanIds,
        candidates: candidates
      };
    }

    function normalizeRuleKey(value) {
      return String(value == null ? "" : value)
        .trim()
        .normalize("NFKC");
    }

    function planLabel(row) {
      const amount = row.fee_type === "回数料金"
        ? Number(row.unit_price || 0)
        : Number(row.cap_amount || 0);
      const description = String(row.description || "").trim();
      return row.plan_id + "｜" + row.plan_name +
        (amount ? "（" + amount.toLocaleString("ja-JP") + "円）" : "") +
        (description ? "｜" + description : "");
    }

    function renderSummary() {
      if (!options) return;
      const typeLabels = {
        MEMBER_CARD:"会員カード",
        PAYMENT_MONTHLY:"月謝",
        PAYMENT_ONETIME:"都度支払い",
        DOJO:"道場",
        TEACHER:"先生"
      };
      const lines = ["<strong>QR種別</strong>" + escapeHtml(typeLabels[qrType])];

      if (qrType === "MEMBER_CARD" || qrType === "PAYMENT_MONTHLY" || qrType === "PAYMENT_ONETIME") {
        const member = selectedRow(options.members || [], "member_id", valueOf("memberSelect"));
        lines.push("<strong>会員</strong>" + escapeHtml(member ? member.member_id + "｜" + member.member_name : "未選択"));
      }
      if (qrType === "PAYMENT_MONTHLY" || qrType === "PAYMENT_ONETIME") {
        const rows = qrType === "PAYMENT_MONTHLY" ? (options.monthly_plans || []) : (options.onetime_plans || []);
        const plan = selectedRow(rows, "plan_id", valueOf("planSelect"));
        lines.push("<strong>プラン</strong>" + escapeHtml(plan ? plan.plan_id + "｜" + plan.plan_name : "未選択"));
      }
      if (qrType === "DOJO" || qrType === "TEACHER") {
        const location = selectedRow(options.locations || [], "location_id", valueOf("locationSelect"));
        lines.push("<strong>道場</strong>" + escapeHtml(location ? location.location_id + "｜" + location.location_name : "未選択"));
      }
      if (qrType === "TEACHER") {
        const teacher = selectedRow(options.teachers || [], "teacher_id", valueOf("teacherSelect"));
        lines.push("<strong>先生</strong>" + escapeHtml(teacher ? teacher.teacher_id + "｜" + teacher.teacher_name : "未選択"));
      }

      document.getElementById("selectionSummary").innerHTML = lines.join("<br>");
      const previewButton = document.getElementById("previewButton");
      previewButton.disabled = !isSelectionComplete();
      previewButton.textContent = "プレビューへ";
      document.getElementById("addToPrintListButton").disabled = !isSelectionComplete();
    }

    function openPreview() {
      if(!qrOperationsEnabled)return;
      qrLog("08", "preview requested: type=" + qrType + " options loaded=" + !!options + " complete=" + isSelectionComplete());
      if (!options || !isSelectionComplete()) return;

      let page = "";
      const query = new URLSearchParams();

      if (qrType === "MEMBER_CARD") {
        const member = selectedRow(options.members || [], "member_id", valueOf("memberSelect"));
        if (!member) return;
        page = "member-card.html";
        query.set("member_id", member.member_id);
        query.set("member_name", member.member_name || "");
      }

      if (qrType === "PAYMENT_MONTHLY" || qrType === "PAYMENT_ONETIME") {
        const member = selectedRow(options.members || [], "member_id", valueOf("memberSelect"));
        const planRows = qrType === "PAYMENT_MONTHLY"
          ? (options.monthly_plans || [])
          : (options.onetime_plans || []);
        const plan = selectedRow(planRows, "plan_id", valueOf("planSelect"));
        if (!member || !plan) return;

        page = qrType === "PAYMENT_MONTHLY"
          ? "payment-monthly.html"
          : "payment-onetime.html";
        query.set("member_id", member.member_id);
        query.set("member_name", member.member_name || "");
        query.set("plan_id", plan.plan_id);
        query.set("plan_name", plan.plan_name || "");
        query.set("description", plan.description || "");
        const amount = qrType === "PAYMENT_MONTHLY"
          ? Number(plan.cap_amount || 0)
          : Number(plan.unit_price || 0);
        query.set("amount", String(amount));
      }

      if (qrType === "DOJO") {
        const locationRow = selectedRow(
          options.locations || [],
          "location_id",
          valueOf("locationSelect")
        );
        if (!locationRow) return;
        page = "dojo.html";
        query.set("location_id", locationRow.location_id);
        query.set("location_name", locationRow.location_name || "");
      }

      if (qrType === "TEACHER") {
        const teacher = selectedRow(
          options.teachers || [],
          "teacher_id",
          valueOf("teacherSelect")
        );
        if (!teacher) return;
        const locationRow = selectedRow(
          options.locations || [],
          "location_id",
          valueOf("locationSelect")
        );
        if (!locationRow) return;
        page = "teacher.html";
        query.set("teacher_id", teacher.teacher_id);
        query.set("teacher_name", teacher.teacher_name || "");
        query.set("role_name", teacher.role_name || "");
        query.set("location_id", locationRow.location_id);
        query.set("location_name", locationRow.location_name || "");
      }

      if (!page) return;
      qrLog("09", "preview navigate: page=" + page + " (parameters omitted)");
      location.href = "sheets/" + page + "?" + query.toString();
    }

    function isSelectionComplete() {
      if (!options) return false;
      if (qrType === "MEMBER_CARD") return !!valueOf("memberSelect");
      if (qrType === "PAYMENT_MONTHLY" || qrType === "PAYMENT_ONETIME") return !!valueOf("memberSelect") && !!valueOf("planSelect");
      if (qrType === "DOJO") return !!valueOf("locationSelect");
      if (qrType === "TEACHER") return !!valueOf("teacherSelect") && !!valueOf("locationSelect");
      return false;
    }

    function qrTargetOptions() {
      const result = { image:{ size:"720x720", ecc:"M" } };
      const isFirebaseDevHosting = location.hostname === "dojo-management-dev.web.app" ||
        location.hostname === "dojo-management-dev.firebaseapp.com";
      if (isFirebaseDevHosting) {
        result.baseUrl = location.origin + "/qr/";
        result.routes = {
          MEMBER_CARD:"attendance.html",
          PAYMENT_MONTHLY:"paypay_code.html",
          PAYMENT_ONETIME:"paypay_code.html",
          DOJO:"attendance.html",
          TEACHER:"teacher_attendance.html"
        };
      }
      return result;
    }

    function currentQrItem() {
      if (!options || !isSelectionComplete()) return null;
      const params = {};
      let name = "";
      let detail = "";
      let primaryName = "";
      let secondaryName = "";
      let identityLabel = "QR ID";
      let identityValue = "";
      let selectedDojo = null;

      if (qrType === "MEMBER_CARD" || qrType === "PAYMENT_MONTHLY" || qrType === "PAYMENT_ONETIME") {
        const member = selectedRow(options.members || [], "member_id", valueOf("memberSelect"));
        if (!member) return null;
        params.member_id = member.member_id;
        name = member.member_name || member.member_id;
        detail = "会員 " + member.member_id;
        primaryName = member.member_name || "（氏名未設定）";
        identityLabel = "会員ID";
        identityValue = member.member_id;
      }
      if (qrType === "PAYMENT_MONTHLY" || qrType === "PAYMENT_ONETIME") {
        const plans = qrType === "PAYMENT_MONTHLY" ? (options.monthly_plans || []) : (options.onetime_plans || []);
        const plan = selectedRow(plans, "plan_id", valueOf("planSelect"));
        if (!plan) return null;
        params.plan_id = plan.plan_id;
        name += "／" + (plan.plan_name || plan.plan_id);
        detail += "・" + plan.plan_id;
        secondaryName = plan.plan_name || plan.plan_id;
      }
      if (qrType === "DOJO" || qrType === "TEACHER") {
        selectedDojo = selectedRow(options.locations || [], "location_id", valueOf("locationSelect"));
        if (!selectedDojo) return null;
        params.location_id = selectedDojo.location_id;
        name = selectedDojo.location_name || selectedDojo.location_id;
        detail = "道場 " + selectedDojo.location_id;
        primaryName = selectedDojo.location_name || selectedDojo.location_id;
        identityLabel = "道場ID";
        identityValue = selectedDojo.location_id;
      }
      if (qrType === "TEACHER") {
        const teacher = selectedRow(options.teachers || [], "teacher_id", valueOf("teacherSelect"));
        if (!teacher) return null;
        params.teacher_id = teacher.teacher_id;
        name = (teacher.teacher_name || teacher.teacher_id) + "／" + name;
        detail = "先生 " + teacher.teacher_id + "・" + detail;
        primaryName = teacher.teacher_name || "（先生名未設定）";
        secondaryName = (teacher.role_name ? teacher.role_name + "／" : "") +
          (selectedDojo.location_name || selectedDojo.location_id);
        identityLabel = "先生ID";
        identityValue = teacher.teacher_id;
      }

      const qr = DojoQrGenerator.buildQr(qrType, params, qrTargetOptions());
      return {
        type:qrType,
        name:name,
        detail:detail,
        primaryName:primaryName,
        secondaryName:secondaryName,
        identityLabel:identityLabel,
        identityValue:identityValue,
        targetUrl:qr.targetUrl,
        imageUrl:qr.imageUrl
      };
    }

    function addCurrentQrToPrintList() {
      if(!qrOperationsEnabled)return;
      const item = currentQrItem();
      if (!item) return;
      printItems.push(item);
      renderPrintList();
      qrLog("10", "print list added: type=" + item.type + " count=" + printItems.length);
    }

    function renderPrintList() {
      document.getElementById("printList").innerHTML = printItems.map(function(item, index) {
        return '<li class="print-list-item">' +
          '<div><div class="print-list-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="print-list-url">' + escapeHtml(item.targetUrl) + '</div></div>' +
          '<button type="button" data-print-index="' + index + '">削除</button></li>';
      }).join("");
      const pages = DojoQrGenerator.paginate(printItems, 8).length;
      document.getElementById("printListSummary").textContent = printItems.length + "枚（B5 " + pages + "ページ）";
      document.getElementById("clearPrintListButton").disabled = printItems.length === 0;
      document.getElementById("printPdfButton").disabled = printItems.length === 0;
    }

    function renderPrintDocument() {
      const pages = DojoQrGenerator.paginate(printItems, 8);
      document.getElementById("printDocument").innerHTML = pages.map(function(page) {
        return '<section class="print-page">' + page.map(function(item) {
          return '<article class="print-card"><div class="print-card-shell">' +
            printCardMarkup(item) + '</div></article>';
        }).join("") + '</section>';
      }).join("");
    }

    function printCardMarkup(item) {
      const isTeacher = item.type === "TEACHER";
      const isMember = item.type === "MEMBER_CARD";
      const cardClass = isTeacher ? "qr-sheet qr-sheet--teacher" : "qr-sheet";
      const eyebrow = isTeacher ? "先生カード" : (isMember ? "会員カード" : "QRカード");
      const sheetKind = isTeacher ? "TEACHER / INSTRUCTOR" : (isMember ? "MEMBER / ATTENDANCE" : "DOJO SYSTEM / QR");
      const usage = isTeacher ? "先生用QR" : (isMember ? "稽古の出席受付" : "道場システムQR");
      const instruction = isTeacher
        ? "先生・道場情報を設定して開始します。"
        : (isMember ? "受付時にこのQRコードを読み取ってください。" : "用途に応じてこのQRコードを読み取ってください。");
      const secondaryClass = isTeacher ? "print-location" : "teacher-role";
      return '<main class="' + cardClass + '"><div class="sheet-inner">' +
        '<header class="sheet-head"><div class="function-icon" aria-hidden="true">' + personIconSvg() + '</div>' +
        '<div><div class="dojo-name">桜風館</div><div class="sheet-kind">' + sheetKind + '</div></div></header>' +
        '<section class="member-block"><div class="eyebrow">' + eyebrow + '</div>' +
        '<div class="member-name">' + escapeHtml(item.primaryName) + '</div>' +
        (item.secondaryName ? '<div class="' + secondaryClass + '">' + escapeHtml(item.secondaryName) + '</div>' : '') +
        '<div class="member-id">' + escapeHtml(item.identityLabel) + '&nbsp; <strong>' + escapeHtml(item.identityValue) + '</strong></div></section>' +
        '<section class="qr-zone"><div class="qr-frame"><img src="' + escapeHtml(item.imageUrl) + '" alt=""></div></section>' +
        '<footer class="sheet-foot"><div class="usage">' + usage + '<small>' + instruction + '</small></div>' +
        flowerMarkSvg() + '</footer></div></main>';
    }

    function personIconSvg() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">' +
        '<circle cx="9" cy="7" r="3"></circle><path d="M3.5 18c.6-4 2.6-6 5.5-6s4.9 2 5.5 6"></path>' +
        '<path d="m15 14 2.1 2.1L21 12.2"></path></svg>';
    }

    function flowerMarkSvg() {
      return '<svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6">' +
        '<path d="M24 23C13 18 13 8 24 5c11 3 11 13 0 18Z"></path>' +
        '<path d="M25 24c5-11 15-9 17 2-5 10-14 8-17-2Z"></path>' +
        '<path d="M23 25c11 3 10 14 0 18-10-4-11-15 0-18Z"></path>' +
        '<path d="M22 24c-5 11-15 9-17-2 5-10 14-8 17 2Z"></path>' +
        '<circle cx="24" cy="24" r="2.4"></circle></g></svg>';
    }

    function waitForPrintImages() {
      const images = Array.from(document.querySelectorAll("#printDocument img"));
      return Promise.all(images.map(function(image) {
        if (image.complete && image.naturalWidth > 0) return Promise.resolve();
        return new Promise(function(resolve, reject) {
          image.addEventListener("load", resolve, { once:true });
          image.addEventListener("error", function() { reject(new Error("QR画像を取得できませんでした。")); }, { once:true });
        });
      }));
    }

    function printB5Pdf() {
      if(!qrOperationsEnabled)return;
      if (printItems.length === 0) return;
      const button = document.getElementById("printPdfButton");
      button.disabled = true;
      button.textContent = "QR画像を準備中...";
      renderPrintDocument();
      waitForPrintImages().then(function() {
        window.print();
      }).catch(function(error) {
        document.getElementById("printListSummary").className = "note error";
        document.getElementById("printListSummary").textContent = error.message || String(error);
      }).finally(function() {
        button.disabled = false;
        button.textContent = "B5 PDF／印刷";
      });
    }

    function populateSelect(id, rows, valueKey, labelBuilder) {
      const select = document.getElementById(id);
      const previous = select.value;
      select.innerHTML = rows.map(function(row) {
        return '<option value="' + escapeHtml(row[valueKey]) + '">' + escapeHtml(labelBuilder(row)) + '</option>';
      }).join("");
      if (previous && rows.some(function(row) { return String(row[valueKey]) === previous; })) {
        select.value = previous;
      }
    }

    function selectedRow(rows, key, value) {
      return rows.find(function(row) { return String(row[key]) === String(value); }) || null;
    }

    function valueOf(id) { return document.getElementById(id).value || ""; }
    function setVisible(id, visible) { document.getElementById(id).classList.toggle("hidden", !visible); }
    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value == null ? "" : value);
      return div.innerHTML;
    }

    // Explicit opt-in for the staged Cloud Run revision. Never accept a URL from
    // query parameters: an arbitrary endpoint could receive Firebase ID tokens.
    function qrOptionsApiBaseUrl() {
      const useCandidate = new URLSearchParams(window.location.search).get("qr_candidate") === "1";
      if (!useCandidate) return String(RUNTIME_CONFIG.apiBaseUrl || "").replace(/\/+$/, "");
      if (!IS_FIREBASE || RUNTIME_CONFIG.target !== "dev-firebase") {
        throw new Error("QR candidate is restricted to the Firebase development target.");
      }
      return "https://candidate---dojo-time-travel-admin-q6ujypei6a-an.a.run.app";
    }

    async function loadFirebaseOptions() {
      await firebaseAuthClient.ready;
      const response = await dojoApiClient.request(
        qrOptionsApiBaseUrl() + "/api/webconnect?action=qr_generator_options",
        { method:"GET" }
      );
      if (!response.ok) {
        if (response.status === 403) throw new Error("管理者権限がありません（HTTP 403）。");
        if (response.status === 401) throw new Error("Firebase認証が必要です（HTTP 401）。");
        throw new Error("QR生成用マスタの取得に失敗しました（HTTP " + response.status + "）。");
      }
      return response.json();
    }

    function jsonp(url, params) {
      return new Promise(function(resolve, reject) {
        const callbackName = "qrGeneratorCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");
        const query = new URLSearchParams(params || {});
        query.set("callback", callbackName);
        query.set("_ts", Date.now());
        let scriptErrorObserved = false;
        qrLog("NET", "JSONP request: action=" + String(params && params.action || "") + " configured=" + !!url);
        const timer = window.setTimeout(function() {
          qrLog("E2", "JSONP timeout; scriptErrorObserved=" + scriptErrorObserved);
          cleanup();
          reject(new Error(scriptErrorObserved ? "GASとの通信に失敗しました。" : "GAS接続がタイムアウトしました。"));
        }, 20000);

        window[callbackName] = function(data) {
          qrLog("NET", "JSONP callback: ok=" + !!(data && data.ok));
          cleanup();
          resolve(data);
        };
        script.onerror = function() { scriptErrorObserved = true; qrLog("E3", "JSONP script error observed"); };
        function cleanup() {
          window.clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        script.src = url + "?" + query.toString();
        document.head.appendChild(script);
      });
    }
  </script>
  <script src="system_context.js"></script>
