<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>会員ホーム</title><link rel="stylesheet" href="common.css"></head>
<body class="member">
  <h1>🥋 会員ホーム</h1>
  <section class="card login-state"><strong id="loginIdentity">未ログイン</strong><span id="gasResponseTime" class="note">応答：計測中...</span><button onclick="logoutSession()">ログアウト</button></section>
  <h2>会員メニュー</h2>
  <section class="card">
    <h2>🥋 稽古・審査</h2>
    <div class="grid">
      <a class="button member-link" href="attendance.html">🥋 出席登録</a>
      <a class="button member-link" id="attendanceSummaryLink" href="attendance_summary.html">📅 出席・審査進捗</a>
      <a class="button member-link" href="paper_attendance_member.html">📷 紙の出席記録読取</a>
    </div>
  </section>
  <section class="card">
    <h2>💴 会費・決済</h2>
    <div class="grid">
      <a class="button member-link" href="paypay_code.html">📲 PayPay決済コード登録</a>
      <a class="button member-link" href="#">💰 会費状況（準備中）</a>
    </div>
  </section>
  <section class="card">
    <h2>📢 お知らせ</h2>
    <div class="grid">
      <a class="button member-link" href="#">📢 お知らせ（準備中）</a>
    </div>
  </section>
  <p class="note"><a href="index.html">入口へ戻る</a></p>
  <section class="card"><h2>診断ログ</h2><pre id="operationLog" style="white-space:pre-wrap;word-break:break-word;margin:0;"></pre></section>
  <script src="virtual_session.js"></script>
  <script>
    const memberHomeStartedAt = performance.now();
    function memberHomeLog(step, detail) {
      const line = "[MEMBER-HOME " + step + " +" + Math.round(performance.now() - memberHomeStartedAt) + "ms] " + (detail || "");
      const root = document.getElementById("operationLog");
      if (root) root.textContent = line + "\n" + root.textContent;
      console.log(line);
    }
    memberHomeLog("01", "init start");
    const queryMemberId = new URLSearchParams(location.search).get("member_id") || "";
    if (queryMemberId) DojoVirtualSession.loginMember(queryMemberId, "PAGE_URL");
    memberHomeLog("02", "query member_id present=" + !!queryMemberId);
    const memberSession = DojoVirtualSession.get();
    memberHomeLog("03", "session role=" + (memberSession ? memberSession.role : "none") + " member_id present=" + !!(memberSession && memberSession.member_id));
    const memberId = memberSession && memberSession.role === "MEMBER" ? memberSession.member_id : queryMemberId;
    if (memberId) {
      document.getElementById("loginIdentity").textContent = "会員 " + memberId + " でログイン中";
      document.getElementById("attendanceSummaryLink").href =
        "attendance_summary.html?member_id=" + encodeURIComponent(memberId);
    }
    memberHomeLog("04", "identity rendered; member_id present=" + !!memberId);
    let systemContextStartedAt = null;
    function renderGasResponseTime(label) {
      const root = document.getElementById("gasResponseTime");
      if (root) root.textContent = "応答：" + label;
    }
    window.addEventListener("dojo-system-context", function(event) {
      const data = event.detail || {};
      memberHomeLog("05", "system_context ok=" + !!data.ok + " time_travel=" + !!data.time_travel_enabled + " system_now present=" + !!data.system_now);
      const elapsedMs = systemContextStartedAt == null ? null : Date.now() - systemContextStartedAt;
      if (elapsedMs != null) renderGasResponseTime((elapsedMs / 1000).toFixed(2) + "秒");
    });
    window.addEventListener("dojo-system-context-error", function(event) {
      memberHomeLog("E1", "system_context error=" + String((event.detail || {}).message || "unknown"));
      const elapsedMs = systemContextStartedAt == null ? null : Date.now() - systemContextStartedAt;
      renderGasResponseTime(elapsedMs == null ? "TIMEOUT" : "TIMEOUT (" + (elapsedMs / 1000).toFixed(2) + "秒)");
    });
    systemContextStartedAt = Date.now();
    memberHomeLog("06", "system_context request pending; runtime_config next");

    function logoutSession() {
      DojoVirtualSession.logout();
      location.href = "index.html";
    }
  </script>
  <script src="runtime_config.js"></script>
  <script src="system_context.js"></script>
</body></html>
