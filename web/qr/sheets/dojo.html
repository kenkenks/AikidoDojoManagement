<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>桜風館 道場QR</title>
  <link rel="stylesheet" href="../assets/qr-sheet.css">
</head>
<body>
  <nav class="preview-toolbar" aria-label="プレビュー操作">
    <a href="../qr_generator.html">← QR生成へ戻る</a>
    <button type="button" onclick="window.print()">印刷</button>
  </nav>

  <div class="preview-stage">
    <main class="qr-sheet qr-sheet--dojo" aria-label="桜風館 道場QR">
      <div class="sheet-inner">
        <header class="dojo-head">
          <div class="dojo-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M4 10.5 12 4l8 6.5"></path>
              <path d="M6.5 9.5V20h11V9.5"></path>
              <path d="M9 20v-6h6v6"></path>
              <circle cx="12" cy="9" r="1.2"></circle>
            </svg>
          </div>
          <div>
            <div class="dojo-brand">桜風館</div>
            <div class="dojo-kind">DOJO / LOCATION QR</div>
          </div>
        </header>

        <section class="dojo-message">
          <div class="dojo-eyebrow">稽古受付</div>
          <div class="dojo-title">まず、この道場QRを<br>読み取ってください</div>
          <div class="dojo-meta">
            <div id="locationName" class="dojo-name-display">桜風館</div>
            <div class="dojo-id-display">道場ID&nbsp; <strong id="locationId">L001</strong></div>
          </div>
        </section>

        <section class="dojo-qr-zone" aria-label="道場QR">
          <div class="dojo-qr-frame">
            <img id="qrImage" alt="道場QR">
          </div>
        </section>

        <footer class="dojo-foot">
          <div class="dojo-instruction">
            出席受付の最初に読み取ります。
            <small>読み取り後、会員カードなど次のQRへ進んでください。</small>
          </div>
          <svg class="dojo-mark" viewBox="0 0 48 48" aria-label="桜の印">
            <g fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M24 23C13 18 13 8 24 5c11 3 11 13 0 18Z"/>
              <path d="M25 24c5-11 15-9 17 2-5 10-14 8-17-2Z"/>
              <path d="M23 25c11 3 10 14 0 18-10-4-11-15 0-18Z"/>
              <path d="M22 24c-5 11-15 9-17-2 5-10 14-8 17 2Z"/>
              <circle cx="24" cy="24" r="2.4"/>
            </g>
          </svg>
        </footer>
      </div>
    </main>
  </div>

  <div id="error" class="error" role="alert"></div>

  <script src="../qr_generator.js"></script>
  <script>
    (function () {
      "use strict";
      const params = new URLSearchParams(location.search);
      const locationId = (params.get("location_id") || "").trim();
      const locationName = (params.get("location_name") || "").trim();
      const error = document.getElementById("error");
      try {
        if (!locationId) throw new Error("location_id が指定されていません。");
        const qr = DojoQrGenerator.buildQr(
          DojoQrGenerator.QR_TYPES.DOJO,
          { location_id: locationId },
          { image: { size: "900x900", ecc: "M" } }
        );
        document.getElementById("locationId").textContent = locationId;
        document.getElementById("locationName").textContent = locationName || "桜風館";
        const image = document.getElementById("qrImage");
        image.src = qr.imageUrl;
        image.dataset.targetUrl = qr.targetUrl;
        image.addEventListener("error", function () {
          error.textContent = "QR画像を取得できませんでした。";
        });
        document.title = "桜風館 道場QR " + locationId;
      } catch (e) {
        document.getElementById("qrImage").removeAttribute("src");
        error.textContent = e && e.message ? e.message : String(e);
      }
    })();
  </script>
</body>
</html>
