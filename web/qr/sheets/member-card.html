<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>会員カード QR</title>
  <style>
    :root {
      --card-width: 86mm;
      --card-height: 54mm;
      --border: #4f6f67;
      --surface: #eef8f4;
      --text: #20312d;
      --muted: #60736e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: #f5f5f5;
    }
    .toolbar {
      max-width: 720px;
      margin: 0 auto 16px;
      display: flex;
      gap: 8px;
      align-items: end;
      flex-wrap: wrap;
    }
    .toolbar label { font-size: 12px; color: #555; }
    .toolbar input {
      display: block;
      min-width: 180px;
      margin-top: 4px;
      padding: 7px 9px;
    }
    .toolbar button { padding: 8px 14px; cursor: pointer; }
    .toolbar a { color:#245b50; font-weight:600; text-decoration:none; margin-right:auto; }
    .sheet {
      width: var(--card-width);
      height: var(--card-height);
      margin: 0 auto;
      padding: 5mm;
      border: 1px solid var(--border);
      border-radius: 3mm;
      background: var(--surface);
      display: grid;
      grid-template-columns: 1fr 31mm;
      grid-template-rows: auto 1fr auto;
      column-gap: 4mm;
      overflow: hidden;
    }
    .title {
      grid-column: 1 / 3;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      border-bottom: 1px solid rgba(79,111,103,.35);
      padding-bottom: 2mm;
    }
    .member {
      align-self: center;
      min-width: 0;
    }
    .member-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 3mm;
      overflow-wrap: anywhere;
    }
    .member-id-label {
      font-size: 9px;
      color: var(--muted);
    }
    .member-id {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
    }
    .qr-wrap {
      grid-column: 2;
      grid-row: 2 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-wrap img {
      width: 29mm;
      height: 29mm;
      display: block;
      background: #fff;
    }
    .footer {
      grid-column: 1;
      font-size: 9px;
      color: var(--muted);
      align-self: end;
    }
    .error {
      max-width: 720px;
      margin: 12px auto;
      color: #9b1c1c;
      font-size: 13px;
    }
    @media print {
      @page { size: 86mm 54mm; margin: 0; }
      body { padding: 0; background: #fff; }
      .toolbar, .error { display: none !important; }
      .sheet { margin: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="../qr_generator.html">← QR生成へ戻る</a>
    <button type="button" onclick="window.print()">印刷</button>
  </div>

  <main id="memberCard" class="sheet" aria-label="会員カード">
    <div class="title">会員カード</div>
    <section class="member">
      <div id="memberName" class="member-name">山田太郎</div>
      <div class="member-id-label">会員ID</div>
      <div id="memberId" class="member-id">M001</div>
    </section>
    <div class="qr-wrap">
      <img id="qrImage" alt="会員カードQR">
    </div>
    <div class="footer">桜風館</div>
  </main>
  <div id="error" class="error" role="alert"></div>

  <script src="../qr_generator.js"></script>
  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(location.search);
      const memberId = (params.get("member_id") || "").trim();
      const memberName = (params.get("member_name") || "").trim();
      const error = document.getElementById("error");

      try {
        if (!memberId) throw new Error("member_id が指定されていません。");

        const qr = DojoQrGenerator.buildQr(
          DojoQrGenerator.QR_TYPES.MEMBER_CARD,
          { member_id: memberId },
          { image: { size: "320x320" } }
        );

        document.getElementById("memberId").textContent = memberId;
        document.getElementById("memberName").textContent = memberName || "（氏名未設定）";
        const qrImage = document.getElementById("qrImage");
        qrImage.src = qr.imageUrl;
        qrImage.dataset.targetUrl = qr.targetUrl;
        qrImage.addEventListener("error", function () {
          error.textContent = "QR画像を取得できませんでした。ネットワーク接続を確認してください。";
        });
        document.title = "会員カード " + memberId;
      } catch (e) {
        document.getElementById("qrImage").removeAttribute("src");
        error.textContent = e && e.message ? e.message : String(e);
      }
    })();
  </script>
</body>
</html>
