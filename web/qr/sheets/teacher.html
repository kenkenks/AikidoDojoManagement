<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>桜風館 先生カード</title>
  <link rel="stylesheet" href="../assets/qr-sheet.css">
  <style>
    /* 先生＋道場プレビュー専用：追加した道場情報とQRの重なりを防ぐ */
    .qr-sheet--teacher .sheet-inner {
      padding: 4mm 5mm 4mm 7mm;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
    }
    .qr-sheet--teacher .sheet-head { padding-bottom: 2mm; }
    .qr-sheet--teacher .member-block { padding-top: 2mm; }
    .qr-sheet--teacher .member-name { margin-top: .4mm; font-size: 5.6mm; }
    .qr-sheet--teacher .teacher-role { margin-top: .5mm; font-size: 2.9mm; }
    .qr-sheet--teacher .member-id { margin-top: .5mm; padding-bottom: 0; font-size: 2.5mm; }
    .qr-sheet--teacher .qr-frame { width: 36mm; height: 36mm; }
    .qr-sheet--teacher .qr-frame img { width: 32mm; height: 32mm; }
    .qr-sheet--teacher .sheet-foot { padding-top: 1.5mm; }
  </style>
</head>
<body>
  <nav class="preview-toolbar" aria-label="プレビュー操作">
    <a href="../qr_generator.html">← QR生成へ戻る</a>
    <button type="button" onclick="window.print()">印刷</button>
  </nav>

  <div class="preview-stage">
    <main class="qr-sheet qr-sheet--teacher" aria-label="桜風館 先生カード">
      <div class="sheet-inner">
        <div class="environment-badge" data-qr-environment>UNKNOWN</div>
        <header class="sheet-head">
          <div class="function-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="9" cy="7" r="3"></circle>
              <path d="M3.5 18c.6-4 2.6-6 5.5-6s4.9 2 5.5 6"></path>
              <path d="M15.5 6.5h5"></path>
              <path d="M18 4v5"></path>
              <path d="M15.5 14h5"></path>
            </svg>
          </div>
          <div>
            <div class="dojo-name">桜風館</div>
            <div class="sheet-kind">TEACHER / INSTRUCTOR</div>
          </div>
        </header>

        <section class="member-block">
          <div class="eyebrow">先生カード</div>
          <div id="teacherName" class="member-name">山田 太郎</div>
          <div id="roleName" class="teacher-role"></div>
          <div id="locationName" class="teacher-role"></div>
          <div id="locationId" class="member-id"></div>
          <div class="member-id">先生ID&nbsp; <strong id="teacherId">T001</strong></div>
        </section>

        <section class="qr-zone" aria-label="先生QR">
          <div class="qr-frame">
            <img id="qrImage" alt="先生QR">
          </div>
        </section>

        <footer class="sheet-foot">
          <div class="usage">
            先生用QR
            <small>先生として道場システムを開始するときに読み取ります。</small>
          </div>
          <svg class="mark" viewBox="0 0 48 48" aria-label="桜の印">
            <g fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M24 23C13 18 13 8 24 5c11 3 11 13 0 18Z"/>
              <path d="M25 24c5-11 15-9 17 2-5 10-14 8-17-2Z"/>
              <path d="M23 25c11 3 10 14 0 18-10-4-11-15 0-18Z"/>
              <path d="M22 24c-5 11-15 9-17-2 5-10 14-8 17 2Z"/>
              <circle cx="24" cy="24" r="2.4"/>
            </g>
          </svg>
        </footer>
      </div>
    </main>
  </div>

  <div id="error" class="error" role="alert"></div>

  <script src="../runtime_config.js"></script>
  <script src="../qr_generator.js"></script>
  <script>
    (function () {
      "use strict";
      DojoQrGenerator.applyEnvironmentLabels(document, window.DOJO_RUNTIME_CONFIG);
      const params = new URLSearchParams(location.search);
      const teacherId = (params.get("teacher_id") || "").trim();
      const teacherName = (params.get("teacher_name") || "").trim();
      const roleName = (params.get("role_name") || "").trim();
      const locationId = (params.get("location_id") || "").trim();
      const locationName = (params.get("location_name") || "").trim();
      const error = document.getElementById("error");

      try {
        if (!teacherId) throw new Error("teacher_id が指定されていません。");
        if (!locationId) throw new Error("location_id が指定されていません。QR生成画面から道場を選択し直してください。");
        // Firebase dev QR only; preserve legacy GitHub Pages behavior.
        const isFirebaseDevHosting = location.hostname === "dojo-management-dev.web.app" ||
          location.hostname === "dojo-management-dev.firebaseapp.com";
        const qrOptions = { image: { size: "480x480", ecc: "M" } };
        if (isFirebaseDevHosting) {
          qrOptions.baseUrl = location.origin + "/qr/";
          qrOptions.routes = { TEACHER: "attendanceCheck.html" };
        }
        const qr = DojoQrGenerator.buildQr(
          DojoQrGenerator.QR_TYPES.TEACHER,
          { teacher_id: teacherId, location_id: locationId },
          qrOptions
        );
        document.getElementById("teacherId").textContent = teacherId;
        document.getElementById("teacherName").textContent = teacherName || "（先生名未設定）";
        const role = document.getElementById("roleName");
        role.textContent = roleName;
        role.style.display = roleName ? "block" : "none";
        document.getElementById("locationName").textContent = "道場：" + (locationName || locationId);
        document.getElementById("locationId").textContent = "道場ID " + locationId;
        const image = document.getElementById("qrImage");
        image.src = qr.imageUrl;
        image.dataset.targetUrl = qr.targetUrl;
        image.addEventListener("error", function () {
          error.textContent = "QR画像を取得できませんでした。";
        });
        document.title = "桜風館 先生カード " + teacherId;
      } catch (e) {
        document.getElementById("qrImage").removeAttribute("src");
        error.textContent = e && e.message ? e.message : String(e);
      }
    })();
  </script>
</body>
</html>
