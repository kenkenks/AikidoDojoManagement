<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>先生ホーム</title><link rel="stylesheet" href="common.css"></head>
<body class="teacher">
  <h1>🥋 先生ホーム</h1>
  <section class="card login-state"><strong id="loginIdentity">未ログイン</strong><button onclick="logoutSession()">ログアウト</button></section>
  <section class="card">
    <h2>先生メニュー</h2>
    <div class="grid">
      <a class="button teacher-link" href="payment_teacher.html">💴 会費受付</a>
      <a class="button teacher-link" href="#">👥 会員検索（準備中）</a>
      <a class="button teacher-link" href="attendanceCheck.html">📅 本日の出席（仮ページ）</a>
      <a class="button teacher-link" href="teacher_attendance.html">🥋 先生出席</a>
      <a class="button teacher-link" href="payment_status.html">💰 会費状況</a>
      <a class="button teacher-link" href="paymentEvidence.html">📲 決済コード確認（仮ページ）</a>
      <a class="button teacher-link" href="qr_generator.html">🔳 QR生成</a>
      <a class="button teacher-link" href="#">📊 月次処理（準備中）</a>
      <a class="button teacher-link" href="#">📢 お知らせ（準備中）</a>
    </div>
  </section>
  <p class="note"><a href="index.html">入口へ戻る</a></p>
  <section class="card">
    <h2>操作ログ</h2>
    <pre id="operationLog" style="white-space:pre-wrap;word-break:break-word;margin:0;"></pre>
  </section>
  <script src="virtual_session.js"></script>
  <script>
    const teacherHomeStartedAt = Date.now();
    function teacherHomeLog(message) {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      const elapsed = Date.now() - teacherHomeStartedAt;
      const line = "[" + hh + ":" + mm + ":" + ss + "] [TEACHER-HOME +" + elapsed + "ms] " + message;
      const root = document.getElementById("operationLog");
      if (root) root.textContent = line + "\n" + root.textContent;
      console.log(line);
    }
    teacherHomeLog("init start");
    const queryTeacherId = new URLSearchParams(location.search).get("teacher_id") || "";
    teacherHomeLog("virtual session read start");
    if (queryTeacherId) DojoVirtualSession.loginTeacher(queryTeacherId, "PAGE_URL");
    const teacherSession = DojoVirtualSession.get();
    teacherHomeLog("virtual session read complete: " + (teacherSession && teacherSession.role === "TEACHER" ? teacherSession.teacher_id : "not logged in"));
    if (teacherSession && teacherSession.role === "TEACHER") {
      document.getElementById("loginIdentity").textContent = "先生 " + teacherSession.teacher_id + " でログイン中";
    }
    window.addEventListener("dojo-system-context", function(event) {
      const data = event.detail || {};
      teacherHomeLog("system_context callback: system_now=" + (data.system_now || "") + " target_month=" + (data.target_month || "") + " time_travel=" + !!data.time_travel_enabled);
      teacherHomeLog("header render complete");
    });
    window.addEventListener("dojo-system-context-error", function(event) {
      const detail = event.detail || {};
      teacherHomeLog("system_context error: " + (detail.message || "unknown error"));
    });
    teacherHomeLog("system_context JSONP start");

    function logoutSession() {
      DojoVirtualSession.logout();
      location.href = "index.html";
    }
    teacherHomeLog("teacher home synchronous init complete");
  </script>
  <script src="system_context.js"></script>
</body></html>
